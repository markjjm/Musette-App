name = "shopping-list-sync"
main = "worker.js"
compatibility_date = "2026-07-01"
account_id = "9f2fda20777a150b6eeec70cfd8d6d6d"

# The list lives in a Durable Object now: Cloudflare runs one request at a time
# per object, so read-modify-write is indivisible. KV had no compare-and-swap,
# and two phones syncing in the same second silently lost one side's changes.
[[durable_objects.bindings]]
name = "LIST_DO"
class_name = "ListDO"

# New namespaces must be SQLite-backed, and SQLite DOs are on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListDO"]

# Kept so the Durable Object can adopt the old blob on first read, and as a
# cold backup of the pre-migration state. Nothing writes to it any more.
[[kv_namespaces]]
binding = "LIST"
id = "890f1540fea749baa8c86eff063d925c"

# Per-IP rate limit, checked before any secret comparison so LIST_KEY cannot be
# brute forced. 60 requests / 60s is far above two phones syncing.
# The Worker fails open if this binding is absent, so it is safe to remove.
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Secrets are NOT in this file. They are already set in Cloudflare:
#   LIST_KEY   - shared family key, sent by the app as X-List-Key
#   ADMIN_KEY  - admin key for PUT /plan, sent as X-Admin-Key
# Manage with:  npx wrangler secret put LIST_KEY
# For local dev, put them in worker/.dev.vars (gitignored).
