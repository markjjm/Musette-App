name = "shopping-list-sync"
main = "worker.js"
compatibility_date = "2026-07-01"
# account_id comes from CLOUDFLARE_ACCOUNT_ID in the environment rather than
# living in a file, so a repo that goes public does not name the account.

# NOT optional, and not a default. The moment a [[routes]] block exists, wrangler
# turns workers.dev OFF unless this line says otherwise - it warns, deploys, and
# the old hostname starts answering 1042. Every phone carries that hostname in
# localStorage (v2.cfg), so dropping it is an outage for everyone who has not
# reopened the app since the cutover, which is the whole point of doing this
# gradually. It comes out only when no phone is left on the old URL.
#
# These two are top-level on purpose: in TOML any key written after a [[routes]]
# header belongs to that table, where they are not valid options and the deploy
# is rejected. They have to sit above every section.
workers_dev = true

# Left off deliberately. Preview URLs would put the same authenticated Worker on
# a third hostname that nothing needs and CORS does not name.
preview_urls = false

# The Worker answers on its own hostname under the app's domain, so the page and
# the API are the same SITE and not merely the same account. workers.dev and
# pages.dev are both on the Public Suffix List, which makes every cookie between
# them third-party: partitioned by Firefox, expiry-capped and evicted by Safari,
# i.e. random silent logout as a design feature. That is survivable while auth is
# a header, and is not survivable once sessions exist.
#
# Requires musetteapp.com to be a zone on this Cloudflare account; wrangler
# creates the DNS record. The workers.dev hostname keeps working alongside this,
# which is what makes the cutover gradual rather than a flag day.
# Outbound verification codes. Requires the domain onboarded to Email Sending:
#   npx wrangler email sending enable musetteapp.com
# Without this binding, signup refuses rather than creating accounts whose email
# was never proved - sendCode() checks for it and fails closed.
[[send_email]]
name = "EMAIL"

[[routes]]
pattern = "api.musetteapp.com"
custom_domain = true

# The list lives in a Durable Object: Cloudflare runs one request at a time per
# object, so read-modify-write is indivisible. KV had no compare-and-swap, and
# two phones syncing in the same second silently lost one side's changes.
[[durable_objects.bindings]]
name = "LIST_DO"
class_name = "ListDO"

# New namespaces must be SQLite-backed, and SQLite DOs are on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListDO"]

# Kept so the Durable Object can adopt the old blob on first read, and as a
# cold backup of the pre-migration state. Nothing writes to it any more.
[[kv_namespaces]]
binding = "LIST"
id = "890f1540fea749baa8c86eff063d925c"

# Rate limiting went GA in September 2025 with this top-level [[ratelimits]]
# key. The older [[unsafe.bindings]] form deployed without complaint and even
# showed up in the binding list, but limited nothing: 90 requests in a burst all
# returned 200. Do not go back to it.

# Ordinary traffic. Two phones syncing come nowhere near this.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

# Charged only on a WRONG access code. The code is four digits, so guessing has
# to be expensive; legitimate use never touches this budget.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets are NOT in this file. Set in Cloudflare:
#   LIST_KEY   - the access code, sent by the app as X-List-Key
#   ADMIN_KEY  - for PUT /plan and PUT /undo, sent as X-Admin-Key
# Manage with:  npx wrangler secret put LIST_KEY --config worker/wrangler.toml
#
# Auth fails CLOSED: with no LIST_KEY the Worker returns 503 rather than serving
# the list. To run the list open on purpose, set a plain var OPEN_LIST = "yes".
#
# For local dev, put the secrets in worker/.dev.vars (gitignored).
