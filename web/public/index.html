<style>
/* ============================================================
   Market — warm paper, real hierarchy.
   Every colour is a token so the dark theme is a token swap,
   never a second set of component rules.
   ============================================================ */
:root {
  /* surfaces: paper sits UNDER card, with a real step between them */
  --paper:      #E3DAC2;
  --card:       #FBF8F0;
  --card-sunk:  #EFE8D6;
  --ink:        #17150F;
  --ink-soft:   #4E4838;
  --gravel:     #6B6450;
  --rule:       #D2C7A9;
  --rule-soft:  #E2DAC4;

  /* navy carries the header; it is a surface, not a hairline */
  --pen:        #12305C;
  --pen-deep:   #0B2244;
  --pen-ink:    #F4EFE2;
  --pen-mute:   #9DB4D8;
  --pen-line:   #2A4B7C;
  --pen-text:   #12305C;   /* navy as TEXT on a card surface */

  /* amber marks cook nights — a real tint, not a 1% sliver */
  --mark:       #F0B429;
  --mark-soft:  #FBEFCC;
  --mark-line:  #E2A310;
  --mark-ink:   #7A5100;

  --ok:         #1F6B4A;
  --ok-soft:    #DCEBE2;
  --bad:        #9B2C14;
  --bad-soft:   #F6E2DC;

  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* type scale — 6 steps, used consistently */
  --t-eyebrow: 11px;
  --t-micro:   12.5px;
  --t-meta:    14px;
  --t-body:    17px;
  --t-item:    17px;
  --t-title:   28px;
  --t-figure:  30px;

  --st: env(safe-area-inset-top, 12px);
  --sb: env(safe-area-inset-bottom, 12px);
  --hdr-h: 190px;
  --foot-h: 76px;
  --shadow: 0 1px 0 rgba(23,21,15,.05), 0 6px 18px rgba(23,21,15,.07);

  /* Training intensity: ordinal, so one hue light->dark, never categorical hues.
     Lightness is monotonic; every cell also shows its hours, so colour is a
     supporting encoding and the low steps never carry meaning alone. */
  --i1: #93B2D6;   /* moderate */
  --i2: #5D86BD;   /* loading  */
  --i3: #3A66A4;   /* key      */
  --i4: #12305C;   /* long     */
  --i0: #D2C7A9;   /* rest     */

  /* Carbohydrate density of a meal, in three ordinal steps. The rail's SEGMENT
     COUNT is the encoding; hue only reinforces it, so it survives greyscale. */
  --carb1: #7C8BA1;   /* under 35% of the meal's own calories */
  --carb2: #C87A2B;   /* 35-55% */
  --carb3: #2F8F6B;   /* over 55% */

  /* Carb grid. Two CATEGORIES, not a ramp: where the carbohydrate came from.
     Chosen for a wide L* gap (green ~52, navy ~21) so the stack still reads
     as two parts in greyscale; the bottle half is hatched as well, so colour
     is never the only channel. */
  --tbl:       #3E8E6E;   /* carbohydrate eaten at the table */
  --btl:       #12305C;   /* carbohydrate drunk on the bike  */
  --btl-hatch: #4E6E9E;   /* hatch stripe inside the bottle segment */
  --cg-line:   #B9AE92;   /* 6 and 8 g/kg reference hairlines */
  --cg-todo:   #8C93A6;   /* a ride still to come: outline, not fill */
  --cg-track:  #E2DAC4;   /* adherence track, empty */
  --cg-fill:   #6B6450;   /* adherence track, logged */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #14120E;
    --card:       #211E17;
    --card-sunk:  #1A1712;
    --ink:        #F2EDE1;
    --ink-soft:   #C9C1AE;
    --gravel:     #A69E8A;
    --rule:       #363021;
    --rule-soft:  #2A2519;

    --pen:        #16386B;
    --pen-deep:   #0D2450;
    --pen-ink:    #EDF2FB;
    --pen-mute:   #93AFDA;
    --pen-line:   #2E5590;
    --pen-text:   #93B9EE;   /* light in dark: navy text would vanish */

    --mark:       #F0B429;
    --mark-soft:  #40320F;
    --mark-line:  #A87C0C;
    --mark-ink:   #F5CE70;

    --ok:         #4FB07E;
    --ok-soft:    #16301F;
    --bad:        #E0785A;
    --bad-soft:   #3A1E16;

    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    --i1: #4A6C99; --i2: #6B95CC; --i3: #93B8E6; --i4: #C6DAF5; --i0: #3A3527;
    --carb1: #94A3B8; --carb2: #E0A050; --carb3: #4FB07E;
    --tbl: #3F9E72; --btl: #B4CFF2; --btl-hatch: #7FA3D2;
    --cg-line: #4A4331; --cg-track: #2A2519; --cg-fill: #A69E8A; --cg-todo: #7F8798;
  }
}
:root[data-theme="dark"] {
  --paper:#14120E; --card:#211E17; --card-sunk:#1A1712;
  --ink:#F2EDE1; --ink-soft:#C9C1AE; --gravel:#A69E8A;
  --rule:#363021; --rule-soft:#2A2519;
  --pen:#16386B; --pen-deep:#0D2450; --pen-ink:#EDF2FB; --pen-mute:#93AFDA; --pen-line:#2E5590; --pen-text:#93B9EE;
  --mark:#F0B429; --mark-soft:#40320F; --mark-line:#A87C0C; --mark-ink:#F5CE70;
  --ok:#4FB07E; --ok-soft:#16301F; --bad:#E0785A; --bad-soft:#3A1E16;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  --i1:#4A6C99; --i2:#6B95CC; --i3:#93B8E6; --i4:#C6DAF5; --i0:#3A3527;
  --carb1:#94A3B8; --carb2:#E0A050; --carb3:#4FB07E;
  --tbl:#3F9E72; --btl:#B4CFF2; --btl-hatch:#7FA3D2;
  --cg-line:#4A4331; --cg-track:#2A2519; --cg-fill:#A69E8A; --cg-todo:#7F8798;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sys);
  font-size: var(--t-body);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
/* Built for a phone. On a desktop the 7-column month grid was stretching to
   1600px and the bars shrank to specks in acres of card. Cap the reading
   column; the header and footer stay full-bleed. */
#main { max-width: 760px; margin: 0 auto; }
.htop, .hbot, #tabs, #foot { max-width: 760px; margin-left: auto; margin-right: auto; }

body {
  padding-top: var(--hdr-h);
  padding-bottom: calc(var(--foot-h) + var(--sb) + 8px);
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; border-radius: 4px; }

/* ---------------- header: a navy block that earns its space ------------- */
#hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  background: var(--pen);
  padding-top: var(--st);
  box-shadow: var(--shadow);
}
.htop {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 16px 0; min-height: 26px;
}
.sync-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: var(--t-eyebrow);
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--pen-mute); padding: 4px 0;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pen-mute); flex: 0 0 7px; }
.dot.ok   { background: #58D39B; }
.dot.pend { background: var(--mark); }
.dot.err  { background: #E8836A; }
.hmeta {
  flex: 1; min-width: 0; text-align: right;
  font-family: var(--mono); font-size: var(--t-eyebrow);
  letter-spacing: .1em; text-transform: uppercase; color: var(--pen-mute);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.iconbtn {
  width: 44px; height: 44px; border-radius: 11px;
  color: var(--pen-ink); font-size: 19px; line-height: 1;
  display: grid; place-items: center; flex: 0 0 44px;
}
.iconbtn:active { background: var(--pen-line); }

/* title and money share one line so the header stays short */
.hmain {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 1px 16px 9px;
}
#wlab {
  margin: 0; font-size: var(--t-title); font-weight: 800;
  letter-spacing: -.022em; color: var(--pen-ink); line-height: 1.1;
}
.money { text-align: right; min-width: 0; }
.money .big {
  display: block; font-size: 23px; font-weight: 800; letter-spacing: -.03em;
  color: var(--pen-ink); font-variant-numeric: tabular-nums; line-height: 1.05;
}
.money .of {
  display: block; font-family: var(--mono); font-size: var(--t-eyebrow);
  color: var(--pen-mute); font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
}
.bar { height: 5px; background: var(--pen-deep); overflow: hidden; }
.bar i {
  display: block; height: 100%; width: 0%;
  background: var(--mark); border-radius: 3px;
  transition: width .32s cubic-bezier(.4,0,.2,1);
}

/* week chips sit on paper, below the navy */
#weeks {
  display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  padding: 11px 16px 10px; background: var(--paper);
  -webkit-overflow-scrolling: touch;
}
#weeks::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 0 15px; min-height: 44px; display: inline-flex; align-items: center;
  border-radius: 22px;
  font-size: var(--t-meta); font-weight: 600; white-space: nowrap;
  background: var(--card-sunk); color: var(--gravel);
  border: 1px solid var(--rule-soft);
}
.chip.on { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }

/* sub-tabs for the current mode */
.seg-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px 10px; background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.seg { display: flex; gap: 3px; flex: 1; min-width: 0; }
.seg button {
  flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 6px; border-radius: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: var(--t-meta); font-weight: 650; color: var(--gravel);
  background: var(--card-sunk); border: 1px solid transparent;
}
.seg button.on { background: var(--card); color: var(--pen-text); border-color: var(--rule); box-shadow: 0 1px 2px rgba(23,21,15,.07); }
.seg button[hidden] { display: none; }
.seg[style*='none'] + .filter-toggle { margin-left: auto; }
.filter-toggle {
  min-height: 44px; padding: 0 13px; border-radius: 10px;
  font-size: var(--t-micro); font-weight: 650; white-space: nowrap;
  background: var(--card-sunk); color: var(--gravel); border: 1px solid var(--rule-soft);
}
.filter-toggle.active { background: var(--mark-soft); color: var(--mark-ink); border-color: var(--mark-line); }

/* ---------------- list ------------------------------------------------- */
main { padding-bottom: 18px; }

.sech {
  display: flex; align-items: center; gap: 10px;
  padding: 22px 16px 8px;
  font-size: var(--t-micro); font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--pen-text);
}
.sech::after { content: ""; flex: 1; height: 2px; background: var(--pen-text); opacity: .3; border-radius: 1px; }
.sech.cook { color: var(--mark-ink); }
.sech.cook::after { background: var(--mark-line); opacity: .85; }
.sech.mine { color: var(--ok); }
.sech.mine::after { background: var(--ok); opacity: .3; }

.row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; min-height: 56px;
  background: var(--card);
  border-bottom: 1px solid var(--rule-soft);
  transition: background .16s ease;
}
.row.cook { background: var(--mark-soft); }
.box {
  flex: 0 0 24px; width: 24px; height: 24px; border-radius: 7px;
  border: 2px solid var(--pen-text); color: transparent;
  display: grid; place-items: center; font-size: 15px; line-height: 1;
  transition: background .16s ease, border-color .16s ease, transform .16s ease;
}
.mid { flex: 1; min-width: 0; }
.mid .n { display: block; font-size: var(--t-item); line-height: 1.3; }
.mid .q {
  display: block; font-family: var(--mono); font-size: var(--t-micro);
  color: var(--gravel); letter-spacing: .02em; margin-top: 2px;
}
.mid .note { display: block; font-size: var(--t-micro); color: var(--gravel); margin-top: 2px; }
.row .c {
  font-family: var(--mono); font-size: var(--t-meta); font-weight: 650;
  font-variant-numeric: tabular-nums; color: var(--ink-soft);
}

/* checked: the ground changes, not just the opacity */
.row.done { background: var(--card-sunk); }
.row.done .box { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); transform: scale(.94); }
.row.done .mid .n { color: var(--gravel); text-decoration: line-through; text-decoration-color: var(--rule); }
.row.done .c { color: var(--gravel); }
.row:active { background: var(--mark-soft); }

.del {
  flex: 0 0 34px; width: 34px; height: 34px; border-radius: 9px;
  color: var(--bad); font-size: 19px; line-height: 1;
  display: grid; place-items: center;
}
.del:active { background: var(--bad-soft); }

.empty {
  padding: 46px 28px; text-align: center;
  color: var(--gravel); font-size: var(--t-meta); line-height: 1.6;
}
.wnote {
  margin: 0; padding: 14px 16px;
  background: var(--mark-soft); border-left: 3px solid var(--mark);
  font-size: var(--t-meta); line-height: 1.5; color: var(--mark-ink);
}
.hint {
  padding: 18px 16px 6px; font-size: var(--t-micro);
  color: var(--gravel); line-height: 1.6;
}

/* ---------------- dinners --------------------------------------------- */
.din {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--card);
  border-bottom: 1px solid var(--rule-soft);
}
.din.cook { background: var(--mark-soft); }
.din .d {
  flex: 0 0 62px; font-family: var(--mono); font-size: var(--t-micro);
  font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gravel);
}
.din .x { flex: 1; min-width: 0; }
.din .x b { display: block; font-size: var(--t-item); font-weight: 650; line-height: 1.3; }
.din .x span { display: block; font-family: var(--mono); font-size: var(--t-eyebrow); letter-spacing: .07em; text-transform: uppercase; color: var(--gravel); margin-top: 3px; }
.din .cc { font-family: var(--mono); font-size: var(--t-meta); font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink-soft); }

.card {
  margin: 12px 16px; padding: 16px 18px;
  background: var(--card); border: 1px solid var(--rule-soft);
  border-radius: 12px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 7px; font-size: var(--t-item); font-weight: 750; letter-spacing: -.01em; }
.card p { margin: 0; font-size: var(--t-meta); line-height: 1.55; color: var(--ink-soft); }

/* ---------------- plan: day blocks ------------------------------------ */
.dayblk {
  margin: 0 0 14px; background: var(--card);
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.dayhd {
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
  padding: 13px 16px; background: var(--card);
  border-bottom: 2px solid var(--pen-text);
}
.dayhd.cook { background: var(--mark-soft); border-bottom-color: var(--mark-line); }
.dwd { font-family: var(--mono); font-size: var(--t-eyebrow); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gravel); }
.ddn { font-size: 25px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.dkind { font-family: var(--mono); font-size: var(--t-eyebrow); letter-spacing: .08em; text-transform: uppercase; color: var(--gravel); flex: 1; }
.dkc, .dcb { font-family: var(--mono); font-size: var(--t-meta); font-weight: 700; font-variant-numeric: tabular-nums; }
.dkc i, .dcb i { font-style: normal; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--gravel); margin-left: 3px; }
.pmeal { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--rule-soft); }
.pmeal:last-child { border-bottom: 0; }
.pmeal.onbike { background: var(--mark-soft); }
.pt { flex: 0 0 68px; font-family: var(--mono); font-size: var(--t-micro); font-weight: 650; color: var(--gravel); }
.px { flex: 1; min-width: 0; }
.px b { display: block; font-size: var(--t-meta); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--pen-text); margin-bottom: 5px; }
.pmeal.onbike .px b { color: var(--mark-ink); }
.pi { display: block; font-size: 15.5px; line-height: 1.45; }
.pi i { font-style: normal; font-family: var(--mono); font-size: var(--t-micro); color: var(--gravel); min-width: 46px; display: inline-block; font-variant-numeric: tabular-nums; }
.pm { display: block; font-family: var(--mono); font-size: var(--t-eyebrow); letter-spacing: .06em; text-transform: uppercase; color: var(--gravel); margin-top: 6px; }

/* ---------------- footer: the mode switch ----------------------------- */
footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--card);
  border-top: 1px solid var(--rule);
  padding: 8px 12px calc(var(--sb) + 8px);
  box-shadow: 0 -6px 18px rgba(23,21,15,.07);
}
.modebar { display: flex; gap: 6px; align-items: stretch; }
.modebar .iconbtn { height: auto; align-self: stretch; border-radius: 13px;
  background: var(--card-sunk); color: var(--gravel); }
.modebar .iconbtn:active { background: var(--rule-soft); }
.modebar button {
  /* min-width:0 is load-bearing: without it the sub-label refuses to shrink
     and pushes the whole layout wider than the viewport. */
  flex: 1 1 0; min-width: 0; min-height: 52px; border-radius: 13px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--card-sunk); color: var(--gravel);
  border: 1px solid transparent; overflow: hidden;
}
.modebar button .ml { font-size: var(--t-meta); font-weight: 750; letter-spacing: -.01em; }
.modebar button .ms {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  text-transform: uppercase; opacity: .85;
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.modebar button.on { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.modebar button.on .ms { color: var(--pen-mute); opacity: 1; }

/* ---------------- add button ------------------------------------------ */
.fab {
  position: fixed; right: 16px; bottom: calc(var(--foot-h) + var(--sb) + 14px);
  width: 58px; height: 58px; border-radius: 50%; z-index: 45;
  background: var(--mark); color: #3D2900;
  font-size: 31px; font-weight: 300; line-height: 1;
  display: grid; place-items: center;
  box-shadow: 0 5px 16px rgba(176,122,10,.4);
}
.fab:active { transform: scale(.94); }

/* ---------------- sheets ----------------------------------------------- */
.sheet {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(12,10,6,.5); backdrop-filter: blur(3px);
  display: none; align-items: flex-end;
}
.sheet.open { display: flex; }
.panel {
  width: 100%; background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 22px 20px calc(var(--sb) + 22px);
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 -10px 34px rgba(12,10,6,.28);
}
.panel h2 { margin: 0 0 16px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.panel label {
  display: block; margin: 14px 0 6px;
  font-family: var(--mono); font-size: var(--t-eyebrow);
  letter-spacing: .1em; text-transform: uppercase; color: var(--gravel);
}
.panel input, .panel select {
  width: 100%; padding: 13px 14px; border-radius: 11px;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
  font-size: 16px; /* 16px prevents iOS zoom-on-focus */
}
.panel input:focus, .panel select:focus { outline: none; border-color: var(--pen-text); box-shadow: 0 0 0 3px var(--mark-soft); }
.rowbtn { display: flex; gap: 10px; margin-top: 20px; }
.rowbtn button { flex: 1; min-height: 50px; border-radius: 12px; font-size: var(--t-body); font-weight: 700; }
.rowbtn .cancel { background: var(--card-sunk); color: var(--ink-soft); }
.rowbtn .go { background: var(--pen); color: var(--pen-ink); }
.rowbtn .danger { background: var(--bad-soft); color: var(--bad); }
.panel .small { margin: 14px 0 0; font-size: var(--t-micro); color: var(--gravel); line-height: 1.55; }
.panel .status { margin-top: 12px; font-family: var(--mono); font-size: var(--t-micro); color: var(--gravel); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------------- recipe cards (Dinners) ------------------------------ */
.rcard {
  background: var(--card); border: 1px solid var(--rule-soft);
  border-radius: 14px; margin: 12px 16px; padding: 16px 18px 18px;
  box-shadow: var(--shadow);
}
.rhd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rday {
  font-family: var(--mono); font-size: var(--t-eyebrow); font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; color: var(--pen-text);
}
.rcost { font-family: var(--mono); font-size: var(--t-meta); font-weight: 650; color: var(--gravel); font-variant-numeric: tabular-nums; }
.rdish { margin: 5px 0 3px; font-size: 21px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; }
.rtag {
  margin: 0 0 14px; font-family: var(--mono); font-size: var(--t-eyebrow);
  letter-spacing: .07em; text-transform: uppercase; color: var(--mark-ink);
}
.rsec {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--gravel);
  margin: 0 0 7px; padding-top: 4px; border-top: 1px solid var(--rule-soft);
}
.ring { list-style: none; margin: 0 0 16px; padding: 0; }
.ring li { display: flex; gap: 10px; font-size: 15.5px; line-height: 1.5; align-items: baseline; }
.ring li i {
  font-style: normal; font-family: var(--mono); font-size: var(--t-micro);
  color: var(--gravel); flex: 0 0 76px; font-variant-numeric: tabular-nums;
}
.ring li b, .tagM {
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--mark-ink); background: var(--mark-soft);
  border-radius: 4px; padding: 1px 5px; margin-left: 6px; white-space: nowrap;
}
.rsteps { margin: 0 0 14px; padding-left: 20px; }
.rsteps li { font-size: 15.5px; line-height: 1.55; margin-bottom: 9px; padding-left: 3px; }
.rsteps li::marker { font-family: var(--mono); font-size: var(--t-micro); color: var(--pen-text); font-weight: 700; }
.rtip {
  margin: 0; padding: 10px 12px; border-radius: 9px;
  background: var(--mark-soft); color: var(--mark-ink);
  font-size: var(--t-meta); line-height: 1.45;
}
.rheat {
  display: flex; align-items: baseline; gap: 12px;
  margin: 0 16px 12px; padding: 12px 16px;
  background: var(--card-sunk); border-radius: 11px;
  border-left: 3px solid var(--rule);
}
.rheat .rtext { font-size: var(--t-meta); color: var(--gravel); }
.rheat .rtext i { font-style: normal; color: var(--gravel); opacity: .8; }

/* ---------------- pantry stock view ----------------------------------- */
.row.pan { cursor: pointer; }
.pdot {
  flex: 0 0 14px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft);
}
.row.pan.low .pdot { background: var(--mark); box-shadow: 0 0 0 3px var(--mark-soft); }
.row.pan.out .pdot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.pstate {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 9px; border-radius: 7px;
  background: var(--ok-soft); color: var(--ok); white-space: nowrap;
}
.row.pan.low .pstate { background: var(--mark-soft); color: var(--mark-ink); }
.row.pan.out .pstate { background: var(--bad-soft); color: var(--bad); }
.row.pan.low, .row.pan.out { background: var(--card); }
.tagP {
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--bad); background: var(--bad-soft);
  border-radius: 4px; padding: 2px 6px; margin-left: 8px; white-space: nowrap;
}

.opt {
  font-family: var(--sys); font-size: 10px; font-weight: 600; letter-spacing: 0;
  text-transform: none; color: var(--gravel); background: var(--card-sunk);
  border-radius: 4px; padding: 1px 6px; margin-left: 6px;
}

/* ---------------- training week (Fuel tab) ---------------------------- */
/* ---- Fuel: one day, one timeline --------------------------------------
   A week to move through, four counters that fill as you eat, and the day laid
   out against the clock with its food on the page and the ride in its own slot. */
.hxwk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 14px 12px; }
.hxd {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 0 8px; border: 0; border-radius: 12px; cursor: pointer;
  background: transparent; color: var(--ink-soft); font: inherit; min-height: 46px;
}
.hxd > i { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .1em; opacity: .65; }
.hxd > b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hxd.off { opacity: .3; }
.hxd.now > b { text-decoration: underline; text-underline-offset: 3px; }
.hxd.on { background: var(--pen); color: var(--pen-ink); }
.hxd.on > i { opacity: .85; }

/* the day's own header */
.hxday { display: flex; align-items: center; gap: 10px; margin: 2px 14px; }
.hxdate { display: flex; align-items: baseline; gap: 6px; flex: none; }
.hxdate > i { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gravel); }
.hxdate > b { font-size: 30px; font-weight: 800; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.hxwhat { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.hxwhat > b { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--pen-text); }
.hxwhat > em { font-style: normal; font-size: 12px; color: var(--ink-soft); }
/* Amber means exactly one thing in this view: you are cooking tonight. */
.hxcook {
  flex: none; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: var(--mark-ink); background: var(--mark-soft);
  box-shadow: inset 0 0 0 1px var(--mark-line); border-radius: 5px; padding: 3px 7px;
}
.hxsum { margin: 6px 14px 10px; font-size: 11.5px; color: var(--gravel); font-variant-numeric: tabular-nums; }
.hxsum > s { text-decoration: none; color: var(--ink-soft); }
.hxsum > s::before { content: ' \00b7\00a0'; }

.hxmac { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 14px 12px; }
.hxm > i { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--ink-soft); }
.hxm > b { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
.hxm > b > s { text-decoration: none; font-size: 11px; font-weight: 600; color: var(--gravel); }
.hxm > em { display: block; height: 4px; margin-top: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.hxm > em > u { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--pen-text); text-decoration: none; transition: width .3s ease; }
/* An apportioned number is hatched, never solid — protein and fat do not exist
   per meal, so their bars must not look like the two beside them. */
.hxm.est > i { color: var(--gravel); }
.hxm.est > em > u {
  background-color: transparent;
  background-image: repeating-linear-gradient(135deg, var(--pen-text) 0 3px, transparent 3px 6px);
}
.hxm.low > b > s { color: var(--bad); }

/* the timeline: the rule down the left is the clock */
.hxtl { margin: 0 14px; border-left: 2px solid var(--rule); }
.hxr { display: grid; grid-template-columns: 46px 1fr; align-items: start; gap: 8px; margin-bottom: 6px; }
.hxr > time { font-size: 11px; font-weight: 700; color: var(--gravel); font-variant-numeric: tabular-nums; padding: 12px 0 0 6px; }

.hxc {
  position: relative; border-radius: 11px; overflow: hidden;
  background: var(--card); box-shadow: inset 0 0 0 1px var(--rule);
  padding: 10px 12px 10px 14px; --carb: var(--carb1);
}
.hxc.k1 { --carb: var(--carb1); }
.hxc.k2 { --carb: var(--carb2); }
.hxc.k3 { --carb: var(--carb3); }
.hxc.ate { opacity: .62; }

/* Three stacked slots filled from the bottom. The COUNT is the datum, so the
   rail still reads at 100% greyscale and under any colour-vision deficiency. */
.hxrail { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; display: flex; flex-direction: column-reverse; gap: 2px; padding: 2px 0; }
.hxrail > i { flex: 1; background: var(--rule-soft); border-radius: 3px; }
.hxc.k1 > .hxrail > i:nth-child(1),
.hxc.k2 > .hxrail > i:nth-child(-n+2),
.hxc.k3 > .hxrail > i { background: var(--carb); }

.hxhd { padding-right: 44px; }
.hxhd > .hxt { display: block; font-size: 14px; font-weight: 700; line-height: 1.3; color: var(--ink); }
.hxhd > .hxs { display: block; font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; font-variant-numeric: tabular-nums; }
.hxc.ate > .hxhd > .hxt, .hxc.half > .hxhd > .hxt { text-decoration: line-through; text-decoration-color: var(--gravel); text-decoration-thickness: 1.5px; }

/* the food itself, always on the page — no expander, nothing to discover */
.hxi { list-style: none; margin: 8px 0 0; padding: 6px 0 0; border-top: 1px dashed var(--rule); }
.hxi > li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; padding: 1px 0; font-size: 12.5px; line-height: 1.35; color: var(--ink-soft); }
.hxi > li > i { font-style: normal; font-family: var(--mono); font-size: 11px; font-weight: 650; text-align: right; color: var(--gravel); font-variant-numeric: tabular-nums; }
.hxi > li > span { min-width: 0; overflow-wrap: anywhere; }

/* the only tap target in a card: 44x44, the platform minimum */
.hxtick { position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; cursor: pointer; }
.hxmk { width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--rule); }
/* Eaten is INK, not a hue — it must never compete with the carbohydrate rail. */
.hxc.ate > .hxtick > .hxmk { background: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.hxc.half > .hxtick > .hxmk { background: linear-gradient(90deg, var(--ink) 0 50%, transparent 50% 100%); box-shadow: inset 0 0 0 2px var(--ink); }

.hxride { padding: 10px 12px; border-radius: 11px; background: var(--pen); color: var(--pen-ink); }
.hxride > .hxt { display: block; font-size: 14px; font-weight: 700; }
.hxride > .hxs { display: block; font-size: 11.5px; margin-top: 2px; color: var(--pen-mute); font-variant-numeric: tabular-nums; }
.hxride > .hxs > b { color: var(--pen-ink); font-weight: 700; }
.hxrest { padding: 10px 12px; border-radius: 11px; background: var(--card-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.hxrest > .hxt { display: block; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.hxrest > .hxs { display: block; font-size: 11.5px; margin-top: 2px; color: var(--gravel); }
.rname { font-size: 15px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }
.rstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 6px; margin-bottom: 4px; }
.rst > b { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.rst > i { display: block; font-style: normal; font-size: 9px; letter-spacing: .04em; color: var(--gravel); line-height: 1.3; margin-top: 1px; }
.wks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 12px; }
.wk { text-align: center; padding: 7px 2px; border-radius: 9px; background: var(--card-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.wk > i { display: block; font-style: normal; font-size: 9px; font-weight: 700; color: var(--gravel); }
.wk > b { display: block; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.wk > span { display: block; font-size: 8px; color: var(--ink-soft); line-height: 1.3; }
.wk.part { opacity: .5; }
.wtrend { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 4px; }
.wtrend b.dn { color: #B4531F; } .wtrend b.up { color: #2F6B3A; }
.asec { display: block; padding: 8px 0; border-top: 1px dashed var(--rule); }
.asec > b { display: block; font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--pen-text); margin-bottom: 3px; }
.asec > span { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.hxnote { margin: 10px 16px 2px; font-size: 11px; color: var(--gravel); line-height: 1.45; }

/* Today's card: planned above ridden, and the difference between them. */
.card.coach { padding: 14px 16px 16px; }
.ctype {
  font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: var(--pen-text); margin-bottom: 10px;
}
.meas { color: var(--gravel); font-weight: 700; }
.cmp {
  display: grid; grid-template-columns: 5.5em 1fr auto; align-items: baseline;
  gap: 8px; padding: 5px 0; font-variant-numeric: tabular-nums;
}
.cmp > span { font-size: 13px; color: var(--ink-soft); }
.cmp > b { font-size: 16px; font-weight: 700; }
.cmp.dim > b { color: var(--gravel); font-weight: 600; }
/* The gap is the whole point of the card, so it is the only bold colour on it. */
.cmp.gap { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 8px; }
.cmp.gap > b:last-child { font-size: 19px; font-weight: 800; }
.cmp.gap.under > b:last-child { color: #B4531F; }
.cmp.gap.over  > b:last-child { color: #2F6B3A; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .cmp.gap.under > b:last-child { color: #F0A472; }
  :root:not([data-theme="light"]) .cmp.gap.over  > b:last-child { color: #86C795; }
}
:root[data-theme="dark"] .cmp.gap.under > b:last-child { color: #F0A472; }
:root[data-theme="dark"] .cmp.gap.over  > b:last-child { color: #86C795; }
.cbtn {
  display: block; width: 100%; margin-top: 12px; padding: 11px 14px;
  font: inherit; font-size: 15px; font-weight: 700;
  background: var(--pen); color: var(--pen-ink);
  border: 0; border-radius: 11px; cursor: pointer;
}
.cbtn[disabled] { opacity: .6; }
.adv { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.ahead { font-size: 15px; font-weight: 700; margin: 0 0 6px; line-height: 1.35; }
.adet { font-size: 14px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.45; }
.achg {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
  padding: 8px 0; border-top: 1px dashed var(--rule);
}
.achg > b { font-size: 13px; font-weight: 700; }
.achg > span { grid-column: 1; font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.achg > i {
  grid-row: 1 / span 2; align-self: center; font-style: normal;
  font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.achg > i.dn { color: #B4531F; }
.achg > i.up { color: #2F6B3A; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .achg > i.dn { color: #F0A472; }
  :root:not([data-theme="light"]) .achg > i.up { color: #86C795; }
}
:root[data-theme="dark"] .achg > i.dn { color: #F0A472; }
:root[data-theme="dark"] .achg > i.up { color: #86C795; }
.anone { font-size: 14px; color: var(--ink-soft); margin: 4px 0 0; }
.afoot { font-size: 12px; color: var(--gravel); margin: 10px 0 0; }
.cerr { font-size: 13px; color: var(--gravel); margin: 10px 0 0; }

.trainhd {
  display: flex; gap: 10px; margin: 14px 16px 4px;
  background: var(--pen); color: var(--pen-ink);
  border-radius: 13px; padding: 15px 16px;
}
.trainhd > div { flex: 1; min-width: 0; }
.tnum {
  display: block; font-size: 25px; font-weight: 800; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; line-height: 1.05;
}
.tlab {
  display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--pen-mute); margin-top: 3px;
}
.tday {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--card);
  border-bottom: 1px solid var(--rule-soft);
}
.tday.rest { background: var(--card-sunk); }
.tdate { flex: 0 0 46px; text-align: center; }
.tdate b {
  display: block; font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--gravel);
}
.tdate span { display: block; font-size: 19px; font-weight: 800; line-height: 1.1; }
.tmid { flex: 1; min-width: 0; }
.tkind {
  display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: .09em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px;
  background: var(--card-sunk); color: var(--gravel);
}
.tkind.k-longday   { background: var(--bad-soft);  color: var(--bad); }
.tkind.k-keyday    { background: var(--mark-soft); color: var(--mark-ink); }
.tkind.k-loadingday{ background: var(--pen-soft, var(--card-sunk)); color: var(--pen-text); }
.tkind.k-moderateday { background: var(--ok-soft); color: var(--ok); }
.thrs {
  display: inline-block; margin-left: 8px; font-family: var(--mono);
  font-size: var(--t-meta); font-weight: 700; font-variant-numeric: tabular-nums;
}
.tfuel { text-align: right; min-width: 0; }
.tfuel b {
  display: block; font-family: var(--mono); font-size: var(--t-meta); font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.tfuel b i {
  font-style: normal; font-size: 9px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--gravel); margin-left: 3px;
}
.tfuel span {
  display: block; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .04em; color: var(--gravel); margin-top: 2px;
}

/* ---------------- carb grid: the block at a glance --------------------- */
/* Encoding, stated once so it is not guessable from the code:
     position  = calendar (weekday column x week row) -> the weekly cadence
     bar LENGTH = the day's total carbohydrate in g/kg, axis fixed 0-12
     the SPLIT  = how that total divides: table (bottom) vs bottle (top)
     hairlines  = 6 and 8 g/kg, the standard low/moderate/high carb bands
     track      = how much of it was actually logged as eaten
   Length and split are a PARTITION of one quantity, not two correlated
   channels, which is exactly what the old height-vs-colour grid got wrong. */
.cgwrap { margin: 12px 10px 4px; }
.cggrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cghead {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--gravel);
  text-align: center; padding-bottom: 3px;
}
.cgc {
  -webkit-appearance: none; appearance: none; font: inherit; text-align: center;
  background: var(--card); border: 1px solid var(--rule-soft);
  border-radius: 7px; padding: 4px 1px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-height: 67px; cursor: pointer;
}
.cgc.pad { background: transparent; border-color: transparent; cursor: default; }
.cgc:active { background: var(--card-sunk); }

.cgd {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  color: var(--gravel); font-variant-numeric: tabular-nums; line-height: 1;
}

/* The plot area. The two reference hairlines are painted as a background
   gradient rather than as elements: 31 cells x 2 lines would otherwise be 62
   extra nodes for something that is identical in every cell. */
.cgstack {
  position: relative; width: 100%; height: 44px;
  background-image: linear-gradient(to top,
    transparent 0 calc(50% - 1px),   var(--cg-line) calc(50% - 1px) 50%,
    transparent 50% calc(66.7% - 1px), var(--cg-line) calc(66.7% - 1px) 66.7%,
    transparent 66.7% 100%);
  background-size: 40px 100%; background-position: left bottom; background-repeat: no-repeat;
}
.cgc.pad .cgstack { background-image: none; }

/* --h, --bp are set through the CSSOM in paintMonth(). The CSP is hash-only,
   so a style="height:74%" written into innerHTML is dropped on the floor and
   every bar renders flat. Custom properties assigned from script are fine,
   and they give a continuous scale instead of a .h1-.h20 class ladder. */
.cgbar {
  position: absolute; bottom: 0; left: 50%; margin-left: -20px;
  width: 18px; height: var(--h, 0%);
  display: flex; flex-direction: column;
  border-radius: 3px 3px 0 0; overflow: hidden;
}
.cgb {                      /* bottle: on top, hatched, height set from data */
  height: var(--bp, 0%); flex: none; background-color: var(--btl);
  background-image: repeating-linear-gradient(45deg,
    transparent 0 2px, var(--btl-hatch) 2px 4px);
}
.cgt { flex: 1 1 auto; background: var(--tbl); }   /* table: takes the rest */

/* ---- the ride, beside the food ---------------------------------------
   Track = the block's longest day. Fill = hours actually ridden, shaded by
   the measured rate. Hairline = what the plan asked for, so a short session
   and a missed one cannot look alike. */
.cgr {
  position: absolute; bottom: 0; left: 50%; margin-left: 4px;
  width: 14px; height: 100%;
  background: var(--cg-track); border-radius: 3px; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--rule-soft);
}
.cgrf {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--rh, 0%);
  background: var(--i2); border-radius: 3px;
}
/* Still to come: drawn at the height the plan asks for, hollow. A big Saturday
   two weeks out should look like a big Saturday, not like an empty cell. */
.cgr.todo { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.cgr.todo .cgrf {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--cg-todo);
  border-radius: 3px;
}
/* Asked for and not done: the track stays, empty, with the plan's line on it. */
.cgr.miss { background: var(--cg-track); }
.cgr.miss .cgrf { background: transparent; }
/* No ride was ever planned — no track at all, which is a different fact again. */
.cgr.none { background: transparent; box-shadow: none; }
.cgr.none .cgrf { display: none; }
.cgr.s1 .cgrf { background: var(--i1); }
.cgr.s2 .cgrf { background: var(--i2); }
.cgr.s3 .cgrf { background: var(--i3); }
.cgr.s4 .cgrf { background: var(--i4); }
/* energy inferred from heart rate rather than measured at the crank */
.cgr.est .cgrf {
  background-image: repeating-linear-gradient(135deg,
    rgba(255,255,255,.32) 0 2px, rgba(255,255,255,0) 2px 5px);
}
.cgrp {
  position: absolute; left: -2px; right: -2px; bottom: var(--rp, 0%);
  height: 0; border-top: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--card);
}

.cgv {
  display: flex; align-items: baseline; justify-content: center; gap: 5px;
  font-family: var(--mono); font-size: 9px; font-weight: 650;
  color: var(--ink-soft); font-variant-numeric: tabular-nums; line-height: 1;
}
.cgv > b { color: var(--ink); font-weight: 700; }
/* the unit, small enough not to compete with the number it belongs to */
.cgv > u { text-decoration: none; font-size: 7.5px; color: var(--gravel); margin-left: -1px; }
.cgv > s { text-decoration: none; color: var(--bad); }
.cgv > em { font-style: normal; color: var(--cg-todo); }

/* Adherence. Present only for days that have already happened, so "no track"
   means not yet, and "empty track" means logged and not eaten. Those are
   different facts and the grid must not merge them. */
.cgtrack {
  width: 18px; height: 3px; border-radius: 2px; overflow: hidden;
  background: var(--cg-track); box-shadow: inset 0 0 0 1px var(--rule-soft);
}
.cgfill { display: block; height: 100%; width: var(--ad, 0%); background: var(--cg-fill); }
/* Happened, but never logged. Hollow and dashed so it cannot be mistaken for a
   solid track sitting at zero, which means the opposite. */
.cgtrack.untracked {
  background: none; box-shadow: none;
  border: 1px dashed var(--cg-line); height: 3px;
}

/* Today: a ring, plus the date in the mark colour. Not a fill, because a fill
   would be read as data. */
.cgc.today { border-color: var(--mark-line); box-shadow: 0 0 0 2px var(--mark-soft); }
.cgc.today .cgd { color: var(--mark-ink); }

/* Legend. One real specimen cell plus three labels; it teaches the encoding
   by showing the thing itself rather than by restating it in words. */
.cglegend {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 10px 2px 2px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .04em;
  text-transform: uppercase; color: var(--gravel);
}
.cglegend b { display: block; color: var(--ink-soft); font-weight: 700; }
.cgspec { width: 26px; height: 30px; position: relative; flex: none; }
.cgspec .cgstack { height: 30px; }
.cgspec .cgbar { width: 16px; }
.cgkeys { display: flex; flex-direction: column; gap: 3px; }
.cgkeys span { display: inline-flex; align-items: center; gap: 5px; }
.cgkeys i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.cgkeys i.kt { background: var(--tbl); }
.cgkeys i.kb {
  background-color: var(--btl);
  background-image: repeating-linear-gradient(45deg, transparent 0 2px, var(--btl-hatch) 2px 4px);
}
.cgkeys i.ka { background: var(--cg-fill); height: 3px; border-radius: 2px; }
.cgnote { margin: 6px 2px 0; font-size: var(--t-micro); color: var(--gravel); line-height: 1.5; }
.cgnote b { color: var(--ink-soft); font-weight: 700; }

/* the day's ride, sitting directly above that day's meals */
.pmeal.rideline { background: var(--pen); border-bottom: 0; }
.pmeal.rideline .pt { color: var(--pen-mute); font-weight: 700; }
.pmeal.rideline .px b { color: var(--pen-ink); text-transform: none; letter-spacing: -.01em; font-size: 15.5px; }
.pmeal.rideline .pi { color: var(--pen-ink); }
.pmeal.rideline .pi i { color: var(--pen-mute); min-width: 44px; }
.pmeal.rideline .pm { color: var(--pen-mute); }
.pmeal.rideline.rest { background: var(--card-sunk); }
.pmeal.rideline.rest .pt { color: var(--gravel); }
.pmeal.rideline.rest .px b { color: var(--ink-soft); }
.pmeal.rideline.rest .pm { color: var(--gravel); }

.pantryring li { display: list-item; margin-left: 18px; font-size: 14.5px; color: var(--ink-soft); }
.pantryring { list-style: disc; padding-left: 4px; }
.pantryring li::marker { color: var(--gravel); }

.dayblk.istoday { border: 2px solid var(--mark); border-radius: 12px; overflow: hidden; }
.todaytag {
  background: var(--mark); color: #3D2900;
  font-family: var(--mono); font-size: 10px; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase;
  padding: 5px 14px;
}
</style>
</head>
<body>

<header id="hdr">
  <div class="htop">
    <button class="sync-badge" id="bsync" aria-label="Sync now">
      <span class="dot" id="dot"></span>
      <span id="synctx">Local</span>
    </button>
    <span class="hmeta" id="hmeta"></span>
  </div>
  <div class="hmain">
    <h1 id="wlab">Shopping</h1>
    <div class="money">
      <span class="big" id="got">$0</span>
      <span class="of"><span id="left"></span> <span id="rem"></span></span>
    </div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="scroller" id="weeks"></div>
  <div class="seg-bar">
    <div class="seg" id="tabs">
      <button data-t="A" class="on">List</button>
      <button data-t="D">Dinners</button>
      <button data-t="F">Fuel</button>
    </div>
    <button class="filter-toggle" id="bfilter" title="Toggle checked items">
      <span id="flab">To Get</span>
    </button>
  </div>
</header>

<main id="main"></main>
<button class="fab" id="badd" aria-label="Add item">+</button>

<footer>
  <div class="modebar" id="modebar" role="tablist" aria-label="Mode">
    <button data-m="shop" role="tab"><span class="ml">Shop</span><span class="ms">The list</span></button>
    <button data-m="plan" role="tab"><span class="ml">Plan</span><span class="ms">Meals &amp; fuel</span></button>
    <button class="iconbtn" id="bset" aria-label="Settings">&#9881;</button>
  </div>
</footer>

<div class="sheet" id="addsheet"><div class="panel">
  <h2>Add an item</h2>
  <label>Item Name</label>
  <input id="ai_n" placeholder="e.g., Milk" autocapitalize="sentences" autocomplete="off" list="ai_list">
  <datalist id="ai_list"></datalist>
  <label>Quantity / Size (optional)</label><input id="ai_q" placeholder="e.g., 1 gallon">
  <label>Estimated Price (optional)</label><input id="ai_c" type="text" inputmode="decimal" placeholder="3.29">
  <div class="rowbtn">
    <button class="cancel" data-close>Cancel</button>
    <button class="go" id="ai_go">Add Item</button>
  </div>
  <p class="small">Added items sync to every phone on the same key, so whoever is at the store sees them instantly.</p>
</div></div>

<div class="sheet" id="setsheet"><div class="panel">
  <h2>Sync Configuration</h2>
  <label>Worker URL</label>
  <input id="s_url" placeholder="https://shopping-list-sync.you.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label>Access code</label>
  <input id="s_key" inputmode="numeric" autocomplete="one-time-code" maxlength="12"
         placeholder="4-digit code" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="rowbtn">
    <button class="cancel" data-close>Close</button>
    <button class="go" id="s_go">Save &amp; Sync</button>
  </div>
  <p class="small">Enter the access code once on each phone and the list stays in step between them. Clear the Worker URL to go local-only.</p>
  <div class="status" id="s_stat"></div>
  <div class="rowbtn"><button class="danger" id="reset">Clear this week's check-offs</button></div>
</div></div>

/* Local Storage Helper with Fallback */
const mem = {};
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }
};
const jget = (k,d) => { try { return JSON.parse(LS.get(k)) ?? d; } catch(e){ return d; } };
const jset = (k,v) => LS.set(k, JSON.stringify(v));

/* Old keys were weekId|store|section␟name|qty. Sections and quantities now
   change when items are regrouped and combined, so the key is weekId|store|name.
   Convert once; if two old lines merge into one product, a tick on either
   counts (you bought the turkey, it does not matter which recipe wanted it). */
function migrateTicks(t){
  const fmt = LS.get('v2.tickfmt');
  if (fmt === '4') return t;
  const out = {};
  Object.keys(t || {}).forEach(k => {
    if (k.indexOf('␟') < 0){ out[k] = t[k]; return; }   // extras, or already migrated
    const half = k.split('␟');
    const lead = half[0].split('|');
    const name = half[1].replace(/\|[^|]*$/, '').trim();
    if (lead.length < 2 || !name){ out[k] = t[k]; return; }
    const nk = lead[0] + '|' + name;
    const prev = out[nk];
    out[nk] = !prev ? t[k]
      : { v: !!(prev.v || t[k].v), t: Math.max(prev.t || 0, t[k].t || 0) };
  });
  /* v3 keys were weekId|store|name; the store is gone, so drop that segment. */
  if (fmt === '3'){
    Object.keys(out).forEach(k => {
      const q = k.split('|');
      if (q.length === 3 && (q[1] === 'A' || q[1] === 'M')){
        const nk = q[0] + '|' + q[2];
        const prev = out[nk];
        out[nk] = !prev ? out[k]
          : { v: !!(prev.v || out[k].v), t: Math.max(prev.t || 0, out[k].t || 0) };
        delete out[k];
      }
    });
  }
  LS.set('v2.tickfmt', '4');
  jset('v2.ticks', out);
  return out;
}

/* 'weekend' was a two-day top-up at the start of the August block and is no
   longer wanted. Filtered here rather than in the data so a regenerated
   plan cannot bring it back. */
const HIDE_WEEKS = ['weekend', 'weekend-top-up'];
/* A plan saved before a feature existed must not delete that feature. The server
   held a block with no days[] and no training[], and localStorage had cached
   that same copy — so filling gaps from "whatever is loaded" restored nothing.
   Always fall back to BUNDLED, which ships with the app and is by definition
   the newest shape. */
function fillPlan(p){
  if (!p || !Array.isArray(p.weeks) || !p.weeks.length) return BUNDLED;
  ['days', 'training', 'fuel'].forEach(k => {
    if ((!Array.isArray(p[k]) || !p[k].length) && Array.isArray(BUNDLED[k]) && BUNDLED[k].length) {
      p[k] = BUNDLED[k];
    }
  });
  const byId = {};
  (BUNDLED.weeks || []).forEach(w => { byId[w.id] = w; });
  (p.weeks || []).forEach(w => {
    const b = byId[w.id];
    if (b && Array.isArray(b.days) && b.days.length && (!Array.isArray(w.days) || !w.days.length)) {
      w.days = b.days;
    }
  });
  return p;
}

function weeks(){ return ((plan && plan.weeks) || []).filter(w => HIDE_WEEKS.indexOf(w.id) < 0); }

/* Sync Backend Logic */
let syncing = false;
let planSig = '';

/* Key order is not stable across a round trip, so compare sorted. Anything that
   sorts equal really is unchanged, and a false "changed" only costs a repaint —
   the comparison is allowed to be wrong towards doing more work, never less. */
function stateSig(){
  const m = (o) => Object.keys(o || {}).sort().map(k => k + '=' + JSON.stringify(o[k])).join('|');
  return m(ticks) + '\n' + m(extras) + '\n' + m(pantryState) + '\n' + m(mealLog);
}
let needCode = false;   // set when the Worker rejects the access code
function openSettings(){
  $('#s_url').value = cfg.url;
  $('#s_key').value = cfg.key;
  $('#s_stat').textContent = lastSync ? 'Last synced ' + new Date(lastSync).toLocaleString() : '';
  $('#setsheet').classList.add('open');
  setTimeout(() => { try { $('#s_key').focus(); } catch(e){} }, 250);
}

function setDot(){
  const d = $('#dot');
  const txt = $('#synctx');
  if (!cfg.url) {
    d.className = 'dot';
    txt.textContent = 'Local';
  } else if (!cfg.key || needCode) {
    d.className = 'dot err';
    txt.textContent = 'Tap to enter code';
  } else if (syncing) {
    d.className = 'dot pend';
    txt.textContent = 'Syncing...';
  } else if (dirty) {
    d.className = 'dot pend';
    txt.textContent = 'Saving...';
  } else if (lastSync) {
    d.className = 'dot ok';
    txt.textContent = 'Synced';
  } else {
    d.className = 'dot err';
    txt.textContent = 'Offline';
  }
}

async function sync(push){
  if (!cfg.url || syncing) { setDot(); return; }
  if (!cfg.key) { setDot(); return; }   // nothing to send until there is a code
  syncing = true; setDot();
  try {
    const base = cfg.url.replace(/\/+$/,'');
    const h = {'Content-Type':'application/json'};
    if (cfg.key) h['X-List-Key'] = cfg.key;
    let r;
    if (push || dirty){
      r = await fetch(base + '/state', {method:'PUT', headers:h, body: JSON.stringify({ticks, extras, pantry: pantryState, log: mealLog})});
    } else {
      r = await fetch(base + '/state', {headers:h});
    }
    if (r.status === 401){ needCode = true; openSettings(); throw new Error('Access code not accepted'); }
    if (r.status === 429) throw new Error('Too many attempts — wait a minute');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    const was = stateSig();
    ticks  = s.ticks  || {};
    extras = s.extras || {};
    pantryState = s.pantry || pantryState;
    mealLog = s.log || mealLog;
    let changed = stateSig() !== was;
    /* A plan with no weeks blanks the whole app — no current week, nothing to
       render. Never adopt one; keep whatever is already loaded. */
    if (s.plan && Array.isArray(s.plan.weeks) && s.plan.weeks.length) {
      const sig = JSON.stringify(s.plan);
      if (sig !== planSig) { planSig = sig; plan = fillPlan(s.plan); jset('v2.plan', plan); changed = true; }
    }
    lastRev = Number(s.rev) || lastRev; LS.set('v2.rev', String(lastRev));
    dirty = false;
    lastSync = new Date().toISOString();
    LS.set('v2.lastSync', lastSync);
    persist();
    /* Only repaint when something actually came back different. Every tap
       queues a push 1200 ms later, and that push returns our own state; an
       unconditional render() here rebuilt #main from innerHTML a beat after
       every tap, which on iOS throws away the scroll position. Rebuilding the
       page to tell someone what they just did themselves is pure cost. */
    if (changed) render();
  } catch(e){
    lastSync = lastSync || '';
    $('#s_stat').textContent = 'Sync failed: ' + e.message;
  } finally {
    syncing = false; setDot();
  }
}

/* Live updates. The app used to pull only when it was foregrounded, so a phone
   sitting open never noticed the other one adding something. Poll the tiny /rev
   endpoint while the screen is on, and pull the full list only when the number
   moves. Polling rather than a socket on purpose: this gets used in a shop on
   patchy signal, where a WebSocket spends its life reconnecting. */
const POLL_MS = 4000;
let lastRev = Number(LS.get('v2.rev') || 0);
let pollTimer = null;
let pollFails = 0;

async function pollRev(){
  if (!cfg.url || !cfg.key || syncing || document.hidden) return;
  try {
    const base = cfg.url.replace(/\/+$/,'');
    const h = {'X-List-Key': cfg.key};
    const r = await fetch(base + '/rev', {headers: h});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { rev } = await r.json();
    pollFails = 0;
    if (Number(rev) > lastRev) await sync(false);   // someone else changed it
  } catch(e) {
    pollFails++;
  }
}

function startPolling(){
  stopPolling();
  /* Back off after repeated failures so a dead network is not hammered. */
  const every = POLL_MS * Math.min(8, Math.pow(2, Math.min(pollFails, 3)));
  pollTimer = setInterval(pollRev, every);
}
function stopPolling(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

const queue = () => {
  dirty = true; persist(); setDot();
  clearTimeout(queue._t);
  queue._t = setTimeout(()=>sync(true), 1200);
};

/* Rendering UI */
/* ---- Shopping list normalisation --------------------------------------
   The plan groups a lot of items by recipe ("Mon 3 · Turkey chili"), which is
   how you cook but not how you walk a shop — 55% of items sat in recipe
   sections, and the same product appeared on several lines. shopList() folds
   those into real aisles and combines repeats into one line per product,
   summing the quantity when the units agree. The recipes are not lost: each
   item carries a note saying which meals it is for. */
const COOK_SEC = /\(cook (double|tonight)/i;

/* Order matters and there is no trailing \b: "carrot" has to match "Carrots",
   and \bcarrot\b does not. Jarred/canned goods are matched by phrase first so
   "Diced tomatoes" lands in the cupboard aisle while "Lettuce, tomato, onion"
   stays in produce. */
const AISLE_RULES = [
  /* Cupboard goods first, by phrase: "Peanut butter" is not dairy and
     "Fruit jam" is not produce, but the generic butter/fruit rules below
     would claim both. */
  [/\b(peanut butter|fruit jam|jam|jelly|maple syrup|syrup|vinaigrette|olive oil|diced tomato|canned|marinara|salsa|broth|stock|soy sauce|seasoning|chili spice)/i, 'Canned & jarred'],
  [/\b(turkey|beef|pork|chicken|salmon|tilapia|fish|bacon|sausage|deli)/i, 'Meat & fish'],
  [/\b(cheddar|parmesan|mozzarella|butter|milk|yogurt|egg|cheese|cream)/i, 'Dairy & eggs'],
  [/\b(rice|pasta|ziti|penne|quinoa|tortilla|bun|roll|bread|cornbread|oats|granola|bagel|muffin|pita|pancake|flour)/i, 'Bread & grains'],
  [/\b(green bean|potato|cabbage|carrot|lettuce|onion|pepper|broccoli|asparagus|brussels|sweet corn|vegetable|salad|avocado|garlic|ginger|greens|tomato|fruit|berr|apple|banana|orange|melon)/i, 'Produce'],
  [/\b(bean|sauce|honey|jam|oil|vinegar|spice|nut|almond|walnut|protein|powder)/i, 'Canned & jarred'],
];
const aisleFor = n => {
  for (const [re, sec] of AISLE_RULES) if (re.test(n)) return sec;
  return 'Also needed';
};

/* "2.5 cups dry" -> {n:2.5, u:"cups dry"}. Returns n:null when there is no number. */
function qtyParts(q){
  const m = String(q == null ? '' : q).trim().match(/^(\d+(?:\.\d+)?|\d+\/\d+)?\s*(.*)$/);
  if (!m) return { n: null, u: '' };
  let n = null;
  if (m[1]){
    n = m[1].indexOf('/') >= 0
      ? Number(m[1].split('/')[0]) / Number(m[1].split('/')[1])
      : Number(m[1]);
    if (!isFinite(n)) n = null;
  }
  return { n: n, u: (m[2] || '').trim() };
}

function combineQty(list){
  const raw = list.filter(q => String(q == null ? '' : q).trim() !== '');
  if (!raw.length) return '';
  if (raw.length === 1) return String(raw[0]).trim();
  const parts = raw.map(qtyParts);
  const units = [];
  parts.forEach(p => { if (units.indexOf(p.u.toLowerCase()) < 0) units.push(p.u.toLowerCase()); });
  if (units.length === 1 && parts.every(p => p.n !== null)){
    const sum = Math.round(parts.reduce((a, p) => a + p.n, 0) * 100) / 100;
    return sum + (parts[0].u ? ' ' + parts[0].u : '');
  }
  return raw.map(q => String(q).trim()).join(' + ');   // mixed units: show both
}

/* One line per product, grouped into the plan's own aisle order. */
/* The pantry week doubles as the stock list. */
function pantryItems(){
  const pw = ((plan && plan.weeks) || []).filter(x => x.id === PANTRY_WEEK)[0];
  if (!pw) return [];
  const out = [];
  ['A','M'].forEach(st => ((pw.lists && pw.lists[st]) || []).forEach(s =>
    s.items.forEach(it => out.push({ n: String(it.n || '').trim(), q: it.q || '', c: Number(it.c) || 0,
                                     note: it.note || '', store: st }))));
  return out;
}

function shopList(w){
  const secs = [].concat((w.lists && w.lists.A) || [], (w.lists && w.lists.M) || []);
  const storeOf = new Map();
  ['A','M'].forEach(st => ((w.lists && w.lists[st]) || []).forEach(s =>
    s.items.forEach(it => { if (!storeOf.has(it.n)) storeOf.set(it.n, st); })));
  const order = [];
  secs.forEach(s => { if (!COOK_SEC.test(s.sec) && order.indexOf(s.sec) < 0) order.push(s.sec); });

  const bag = new Map();
  secs.forEach(s => {
    const isCook = COOK_SEC.test(s.sec);
    const meal = isCook
      ? s.sec.replace(/\s*\(cook[^)]*\)\s*/i, '').replace(/^[^·]*·\s*/, '').trim()
      : '';
    s.items.forEach(it => {
      const name = String(it.n || '').trim();
      if (!name) return;
      const key = name.toLowerCase();
      let e = bag.get(key);
      if (!e){
        e = { n: name, sec: isCook ? aisleFor(name) : s.sec, fromCook: isCook,
              store: storeOf.get(it.n) || 'A',
              qs: [], c: 0, meals: [], note: it.note || '' };
        bag.set(key, e);
      } else if (!isCook && e.fromCook){
        e.sec = s.sec; e.fromCook = false;      // a real aisle beats a guessed one
      }
      e.qs.push(it.q);
      e.c += Number(it.c) || 0;
      if (meal && e.meals.indexOf(meal) < 0) e.meals.push(meal);
      if (!e.note && it.note) e.note = it.note;
    });
  });

  const bySec = new Map();
  bag.forEach(e => {
    e.q = combineQty(e.qs);
    if (!e.note && e.meals.length) e.note = 'For ' + e.meals.join(', ');
    if (order.indexOf(e.sec) < 0) order.push(e.sec);
    if (!bySec.has(e.sec)) bySec.set(e.sec, []);
    bySec.get(e.sec).push(e);
  });

  /* Anything added by hand is filed into a real aisle too, rather than piling
     up in an "Added by you" bucket at the bottom — you want the milk you added
     to appear next to the dairy you were already buying. */
  Object.keys(extras).forEach(id => {
    const e = extras[id];
    if (!e || e.deleted || e.week !== w.id) return;
    const sec = aisleFor(e.name || '');
    if (order.indexOf(sec) < 0) order.push(sec);
    if (!bySec.has(sec)) bySec.set(sec, []);
    bySec.get(sec).push({ n: (e.name || '').trim(), q: e.qty || '', c: Number(e.cost) || 0,
                          note: '', store: e.store || 'A', extraId: id });
  });

  /* Staples you have flagged low or out ride along on whatever week you are
     shopping, filed into their aisle like anything else. */
  if (w.id !== PANTRY_WEEK){
    pantryItems().forEach(it => {
      const st = pantryOf(it.n);
      if (st === 'ok') return;
      const sec = aisleFor(it.n);
      if (order.indexOf(sec) < 0) order.push(sec);
      if (!bySec.has(sec)) bySec.set(sec, []);
      bySec.get(sec).push({ n: it.n, q: it.q, c: it.c, note: '', store: it.store, pantry: st });
    });
  }

  return order.filter(sec => bySec.has(sec)).map(sec => ({ sec: sec, items: bySec.get(sec) }));
}
