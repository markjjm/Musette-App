<style>
/* ============================================================
   Market — warm paper, real hierarchy.
   Every colour is a token so the dark theme is a token swap,
   never a second set of component rules.
   ============================================================ */
:root {
  /* surfaces: paper sits UNDER card, with a real step between them */
  --paper:      #E3DAC2;
  --card:       #FBF8F0;
  --card-sunk:  #EFE8D6;
  --ink:        #17150F;
  --ink-soft:   #4E4838;
  --gravel:     #6B6450;
  --rule:       #D2C7A9;
  --rule-soft:  #E2DAC4;

  /* navy carries the header; it is a surface, not a hairline */
  --pen:        #12305C;
  --pen-deep:   #0B2244;
  --pen-ink:    #F4EFE2;
  --pen-mute:   #9DB4D8;
  --pen-line:   #2A4B7C;
  --pen-text:   #12305C;   /* navy as TEXT on a card surface */

  /* amber marks cook nights — a real tint, not a 1% sliver */
  --mark:       #F0B429;
  --mark-soft:  #FBEFCC;
  --mark-line:  #E2A310;
  --mark-ink:   #7A5100;

  --ok:         #1F6B4A;
  --ok-soft:    #DCEBE2;
  --bad:        #9B2C14;
  --bad-soft:   #F6E2DC;

  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* type scale — 6 steps, used consistently */
  --t-eyebrow: 11px;
  --t-micro:   12.5px;
  --t-meta:    14px;
  --t-body:    17px;
  --t-item:    17px;
  --t-title:   28px;
  --t-figure:  30px;

  --st: env(safe-area-inset-top, 12px);
  --sb: env(safe-area-inset-bottom, 12px);
  --hdr-h: 190px;
  --foot-h: 76px;
  --shadow: 0 1px 0 rgba(23,21,15,.05), 0 6px 18px rgba(23,21,15,.07);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #14120E;
    --card:       #211E17;
    --card-sunk:  #1A1712;
    --ink:        #F2EDE1;
    --ink-soft:   #C9C1AE;
    --gravel:     #A69E8A;
    --rule:       #363021;
    --rule-soft:  #2A2519;

    --pen:        #16386B;
    --pen-deep:   #0D2450;
    --pen-ink:    #EDF2FB;
    --pen-mute:   #93AFDA;
    --pen-line:   #2E5590;
    --pen-text:   #93B9EE;   /* light in dark: navy text would vanish */

    --mark:       #F0B429;
    --mark-soft:  #40320F;
    --mark-line:  #A87C0C;
    --mark-ink:   #F5CE70;

    --ok:         #4FB07E;
    --ok-soft:    #16301F;
    --bad:        #E0785A;
    --bad-soft:   #3A1E16;

    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --paper:#14120E; --card:#211E17; --card-sunk:#1A1712;
  --ink:#F2EDE1; --ink-soft:#C9C1AE; --gravel:#A69E8A;
  --rule:#363021; --rule-soft:#2A2519;
  --pen:#16386B; --pen-deep:#0D2450; --pen-ink:#EDF2FB; --pen-mute:#93AFDA; --pen-line:#2E5590; --pen-text:#93B9EE;
  --mark:#F0B429; --mark-soft:#40320F; --mark-line:#A87C0C; --mark-ink:#F5CE70;
  --ok:#4FB07E; --ok-soft:#16301F; --bad:#E0785A; --bad-soft:#3A1E16;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sys);
  font-size: var(--t-body);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
body {
  padding-top: var(--hdr-h);
  padding-bottom: calc(var(--foot-h) + var(--sb) + 8px);
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; border-radius: 4px; }

/* ---------------- header: a navy block that earns its space ------------- */
#hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  background: var(--pen);
  padding-top: var(--st);
  box-shadow: var(--shadow);
}
.htop {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 16px 0; min-height: 26px;
}
.sync-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: var(--t-eyebrow);
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--pen-mute); padding: 4px 0;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pen-mute); flex: 0 0 7px; }
.dot.ok   { background: #58D39B; }
.dot.pend { background: var(--mark); }
.dot.err  { background: #E8836A; }
.hmeta {
  flex: 1; min-width: 0; text-align: right;
  font-family: var(--mono); font-size: var(--t-eyebrow);
  letter-spacing: .1em; text-transform: uppercase; color: var(--pen-mute);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.iconbtn {
  width: 44px; height: 44px; border-radius: 11px;
  color: var(--pen-ink); font-size: 19px; line-height: 1;
  display: grid; place-items: center; flex: 0 0 44px;
}
.iconbtn:active { background: var(--pen-line); }

/* title and money share one line so the header stays short */
.hmain {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 1px 16px 9px;
}
#wlab {
  margin: 0; font-size: var(--t-title); font-weight: 800;
  letter-spacing: -.022em; color: var(--pen-ink); line-height: 1.1;
}
.money { text-align: right; min-width: 0; }
.money .big {
  display: block; font-size: 23px; font-weight: 800; letter-spacing: -.03em;
  color: var(--pen-ink); font-variant-numeric: tabular-nums; line-height: 1.05;
}
.money .of {
  display: block; font-family: var(--mono); font-size: var(--t-eyebrow);
  color: var(--pen-mute); font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
}
.bar { height: 5px; background: var(--pen-deep); overflow: hidden; }
.bar i {
  display: block; height: 100%; width: 0%;
  background: var(--mark); border-radius: 3px;
  transition: width .32s cubic-bezier(.4,0,.2,1);
}

/* week chips sit on paper, below the navy */
#weeks {
  display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  padding: 11px 16px 10px; background: var(--paper);
  -webkit-overflow-scrolling: touch;
}
#weeks::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 0 15px; min-height: 44px; display: inline-flex; align-items: center;
  border-radius: 22px;
  font-size: var(--t-meta); font-weight: 600; white-space: nowrap;
  background: var(--card-sunk); color: var(--gravel);
  border: 1px solid var(--rule-soft);
}
.chip.on { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }

/* sub-tabs for the current mode */
.seg-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px 10px; background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.seg { display: flex; gap: 3px; flex: 1; min-width: 0; }
.seg button {
  flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 6px; border-radius: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: var(--t-meta); font-weight: 650; color: var(--gravel);
  background: var(--card-sunk); border: 1px solid transparent;
}
.seg button.on { background: var(--card); color: var(--pen-text); border-color: var(--rule); box-shadow: 0 1px 2px rgba(23,21,15,.07); }
.seg button[hidden] { display: none; }
.filter-toggle {
  min-height: 44px; padding: 0 13px; border-radius: 10px;
  font-size: var(--t-micro); font-weight: 650; white-space: nowrap;
  background: var(--card-sunk); color: var(--gravel); border: 1px solid var(--rule-soft);
}
.filter-toggle.active { background: var(--mark-soft); color: var(--mark-ink); border-color: var(--mark-line); }

/* ---------------- list ------------------------------------------------- */
main { padding-bottom: 18px; }

.sech {
  display: flex; align-items: center; gap: 10px;
  padding: 22px 16px 8px;
  font-size: var(--t-micro); font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--pen-text);
}
.sech::after { content: ""; flex: 1; height: 2px; background: var(--pen-text); opacity: .3; border-radius: 1px; }
.sech.cook { color: var(--mark-ink); }
.sech.cook::after { background: var(--mark-line); opacity: .85; }
.sech.mine { color: var(--ok); }
.sech.mine::after { background: var(--ok); opacity: .3; }

.row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; min-height: 56px;
  background: var(--card);
  border-bottom: 1px solid var(--rule-soft);
  transition: background .16s ease;
}
.row.cook { background: var(--mark-soft); }
.box {
  flex: 0 0 24px; width: 24px; height: 24px; border-radius: 7px;
  border: 2px solid var(--pen-text); color: transparent;
  display: grid; place-items: center; font-size: 15px; line-height: 1;
  transition: background .16s ease, border-color .16s ease, transform .16s ease;
}
.mid { flex: 1; min-width: 0; }
.mid .n { display: block; font-size: var(--t-item); line-height: 1.3; }
.mid .q {
  display: block; font-family: var(--mono); font-size: var(--t-micro);
  color: var(--gravel); letter-spacing: .02em; margin-top: 2px;
}
.mid .note { display: block; font-size: var(--t-micro); color: var(--gravel); margin-top: 2px; }
.row .c {
  font-family: var(--mono); font-size: var(--t-meta); font-weight: 650;
  font-variant-numeric: tabular-nums; color: var(--ink-soft);
}

/* checked: the ground changes, not just the opacity */
.row.done { background: var(--card-sunk); }
.row.done .box { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); transform: scale(.94); }
.row.done .mid .n { color: var(--gravel); text-decoration: line-through; text-decoration-color: var(--rule); }
.row.done .c { color: var(--gravel); }
.row:active { background: var(--mark-soft); }

.del {
  flex: 0 0 34px; width: 34px; height: 34px; border-radius: 9px;
  color: var(--bad); font-size: 19px; line-height: 1;
  display: grid; place-items: center;
}
.del:active { background: var(--bad-soft); }

.empty {
  padding: 46px 28px; text-align: center;
  color: var(--gravel); font-size: var(--t-meta); line-height: 1.6;
}
.wnote {
  margin: 0; padding: 14px 16px;
  background: var(--mark-soft); border-left: 3px solid var(--mark);
  font-size: var(--t-meta); line-height: 1.5; color: var(--mark-ink);
}
.hint {
  padding: 18px 16px 6px; font-size: var(--t-micro);
  color: var(--gravel); line-height: 1.6;
}

/* ---------------- dinners --------------------------------------------- */
.din {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--card);
  border-bottom: 1px solid var(--rule-soft);
}
.din.cook { background: var(--mark-soft); }
.din .d {
  flex: 0 0 62px; font-family: var(--mono); font-size: var(--t-micro);
  font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gravel);
}
.din .x { flex: 1; min-width: 0; }
.din .x b { display: block; font-size: var(--t-item); font-weight: 650; line-height: 1.3; }
.din .x span { display: block; font-family: var(--mono); font-size: var(--t-eyebrow); letter-spacing: .07em; text-transform: uppercase; color: var(--gravel); margin-top: 3px; }
.din .cc { font-family: var(--mono); font-size: var(--t-meta); font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink-soft); }

.card {
  margin: 12px 16px; padding: 16px 18px;
  background: var(--card); border: 1px solid var(--rule-soft);
  border-radius: 12px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 7px; font-size: var(--t-item); font-weight: 750; letter-spacing: -.01em; }
.card p { margin: 0; font-size: var(--t-meta); line-height: 1.55; color: var(--ink-soft); }

/* ---------------- plan: day blocks ------------------------------------ */
.dayblk {
  margin: 0 0 14px; background: var(--card);
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.dayhd {
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
  padding: 13px 16px; background: var(--card);
  border-bottom: 2px solid var(--pen-text);
}
.dayhd.cook { background: var(--mark-soft); border-bottom-color: var(--mark-line); }
.dwd { font-family: var(--mono); font-size: var(--t-eyebrow); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gravel); }
.ddn { font-size: 25px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.dkind { font-family: var(--mono); font-size: var(--t-eyebrow); letter-spacing: .08em; text-transform: uppercase; color: var(--gravel); flex: 1; }
.dkc, .dcb { font-family: var(--mono); font-size: var(--t-meta); font-weight: 700; font-variant-numeric: tabular-nums; }
.dkc i, .dcb i { font-style: normal; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--gravel); margin-left: 3px; }
.pmeal { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--rule-soft); }
.pmeal:last-child { border-bottom: 0; }
.pmeal.onbike { background: var(--mark-soft); }
.pt { flex: 0 0 68px; font-family: var(--mono); font-size: var(--t-micro); font-weight: 650; color: var(--gravel); }
.px { flex: 1; min-width: 0; }
.px b { display: block; font-size: var(--t-meta); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--pen-text); margin-bottom: 5px; }
.pmeal.onbike .px b { color: var(--mark-ink); }
.pi { display: block; font-size: 15.5px; line-height: 1.45; }
.pi i { font-style: normal; font-family: var(--mono); font-size: var(--t-micro); color: var(--gravel); min-width: 46px; display: inline-block; font-variant-numeric: tabular-nums; }
.pm { display: block; font-family: var(--mono); font-size: var(--t-eyebrow); letter-spacing: .06em; text-transform: uppercase; color: var(--gravel); margin-top: 6px; }

/* ---------------- footer: the mode switch ----------------------------- */
footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--card);
  border-top: 1px solid var(--rule);
  padding: 8px 12px calc(var(--sb) + 8px);
  box-shadow: 0 -6px 18px rgba(23,21,15,.07);
}
.modebar { display: flex; gap: 6px; align-items: stretch; }
.modebar .iconbtn { height: auto; align-self: stretch; border-radius: 13px;
  background: var(--card-sunk); color: var(--gravel); }
.modebar .iconbtn:active { background: var(--rule-soft); }
.modebar button {
  /* min-width:0 is load-bearing: without it the sub-label refuses to shrink
     and pushes the whole layout wider than the viewport. */
  flex: 1 1 0; min-width: 0; min-height: 52px; border-radius: 13px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--card-sunk); color: var(--gravel);
  border: 1px solid transparent; overflow: hidden;
}
.modebar button .ml { font-size: var(--t-meta); font-weight: 750; letter-spacing: -.01em; }
.modebar button .ms {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  text-transform: uppercase; opacity: .85;
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.modebar button.on { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.modebar button.on .ms { color: var(--pen-mute); opacity: 1; }

/* ---------------- add button ------------------------------------------ */
.fab {
  position: fixed; right: 16px; bottom: calc(var(--foot-h) + var(--sb) + 14px);
  width: 58px; height: 58px; border-radius: 50%; z-index: 45;
  background: var(--mark); color: #3D2900;
  font-size: 31px; font-weight: 300; line-height: 1;
  display: grid; place-items: center;
  box-shadow: 0 5px 16px rgba(176,122,10,.4);
}
.fab:active { transform: scale(.94); }

/* ---------------- sheets ----------------------------------------------- */
.sheet {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(12,10,6,.5); backdrop-filter: blur(3px);
  display: none; align-items: flex-end;
}
.sheet.open { display: flex; }
.panel {
  width: 100%; background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 22px 20px calc(var(--sb) + 22px);
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 -10px 34px rgba(12,10,6,.28);
}
.panel h2 { margin: 0 0 16px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.panel label {
  display: block; margin: 14px 0 6px;
  font-family: var(--mono); font-size: var(--t-eyebrow);
  letter-spacing: .1em; text-transform: uppercase; color: var(--gravel);
}
.panel input, .panel select {
  width: 100%; padding: 13px 14px; border-radius: 11px;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
  font-size: 16px; /* 16px prevents iOS zoom-on-focus */
}
.panel input:focus, .panel select:focus { outline: none; border-color: var(--pen-text); box-shadow: 0 0 0 3px var(--mark-soft); }
.rowbtn { display: flex; gap: 10px; margin-top: 20px; }
.rowbtn button { flex: 1; min-height: 50px; border-radius: 12px; font-size: var(--t-body); font-weight: 700; }
.rowbtn .cancel { background: var(--card-sunk); color: var(--ink-soft); }
.rowbtn .go { background: var(--pen); color: var(--pen-ink); }
.rowbtn .danger { background: var(--bad-soft); color: var(--bad); }
.panel .small { margin: 14px 0 0; font-size: var(--t-micro); color: var(--gravel); line-height: 1.55; }
.panel .status { margin-top: 12px; font-family: var(--mono); font-size: var(--t-micro); color: var(--gravel); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header id="hdr">
  <div class="htop">
    <button class="sync-badge" id="bsync" aria-label="Sync now">
      <span class="dot" id="dot"></span>
      <span id="synctx">Local</span>
    </button>
    <span class="hmeta" id="hmeta"></span>
  </div>
  <div class="hmain">
    <h1 id="wlab">Shopping</h1>
    <div class="money">
      <span class="big" id="got">$0</span>
      <span class="of"><span id="left"></span> <span id="rem"></span></span>
    </div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="scroller" id="weeks"></div>
  <div class="seg-bar">
    <div class="seg" id="tabs">
      <button data-t="A" class="on">Aldi</button>
      <button data-t="M">Meijer</button>
      <button data-t="P">Days</button>
      <button data-t="D">Dinners</button>
      <button data-t="F">Fuel</button>
    </div>
    <button class="filter-toggle" id="bfilter" title="Toggle checked items">
      <span id="flab">To Get</span>
    </button>
  </div>
</header>

<main id="main"></main>
<button class="fab" id="badd" aria-label="Add item">+</button>

<footer>
  <div class="modebar" id="modebar" role="tablist" aria-label="Mode">
    <button data-m="shop" role="tab"><span class="ml">Shop</span><span class="ms">The list</span></button>
    <button data-m="plan" role="tab"><span class="ml">Plan</span><span class="ms">Meals &amp; fuel</span></button>
    <button class="iconbtn" id="bset" aria-label="Settings">&#9881;</button>
  </div>
</footer>

<div class="sheet" id="addsheet"><div class="panel">
  <h2>Add an item</h2>
  <label>Item Name</label><input id="ai_n" placeholder="e.g., Milk" autocapitalize="sentences">
  <label>Quantity / Size (optional)</label><input id="ai_q" placeholder="e.g., 1 gallon">
  <label>Estimated Price (optional)</label><input id="ai_c" type="text" inputmode="decimal" placeholder="3.29">
  <label>Store</label>
  <select id="ai_s"><option value="A">Aldi</option><option value="M">Meijer</option></select>
  <div class="rowbtn">
    <button class="cancel" data-close>Cancel</button>
    <button class="go" id="ai_go">Add Item</button>
  </div>
  <p class="small">Added items sync to every phone on the same key, so whoever is at the store sees them instantly.</p>
</div></div>

<div class="sheet" id="setsheet"><div class="panel">
  <h2>Sync Configuration</h2>
  <label>Worker URL</label>
  <input id="s_url" placeholder="https://shopping-list-sync.you.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label>List Key</label>
  <input id="s_key" placeholder="The shared secret key" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="rowbtn">
    <button class="cancel" data-close>Close</button>
    <button class="go" id="s_go">Save &amp; Sync</button>
  </div>
  <p class="small">Leave both blank for local-only mode. With sync enabled, the list updates live across all family devices.</p>
  <div class="status" id="s_stat"></div>
  <div class="rowbtn"><button class="danger" id="reset">Clear this week's check-offs</button></div>
</div></div>

/* Local Storage Helper with Fallback */
const mem = {};
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }
};
const jget = (k,d) => { try { return JSON.parse(LS.get(k)) ?? d; } catch(e){ return d; } };
const jset = (k,v) => LS.set(k, JSON.stringify(v));

/* App State */
let plan   = jget('v2.plan', null) || BUNDLED;
let ticks  = migrateTicks(jget('v2.ticks', {}));

/* Old keys were weekId|store|section␟name|qty. Sections and quantities now
   change when items are regrouped and combined, so the key is weekId|store|name.
   Convert once; if two old lines merge into one product, a tick on either
   counts (you bought the turkey, it does not matter which recipe wanted it). */
function migrateTicks(t){
  if (LS.get('v2.tickfmt') === '3') return t;
  const out = {};
  Object.keys(t || {}).forEach(k => {
    if (k.indexOf('␟') < 0){ out[k] = t[k]; return; }   // extras, or already migrated
    const half = k.split('␟');
    const lead = half[0].split('|');
    const name = half[1].replace(/\|[^|]*$/, '').trim();
    if (lead.length < 2 || !name){ out[k] = t[k]; return; }
    const nk = lead[0] + '|' + lead[1] + '|' + name;
    const prev = out[nk];
    out[nk] = !prev ? t[k]
      : { v: !!(prev.v || t[k].v), t: Math.max(prev.t || 0, t[k].t || 0) };
  });
  LS.set('v2.tickfmt', '3');
  jset('v2.ticks', out);
  return out;
}
let extras = jget('v2.extras', {});
let cfg    = jget('v2.cfg', {url:'', key:''});
let dirty  = jget('v2.dirty', false);
let lastSync = LS.get('v2.lastSync') || '';

let wi = Number(LS.get('v2.week') || 1);
let tab = LS.get('v2.tab') || 'A';
let hideChecked = jget('v2.hideChecked', false); // Store check-off filter mode

/* Two modes over the same five tabs. The tab ids A/M/P/D/F are load-bearing:
   they are baked into every tick key, so they must never be renamed. */
const SHOP_TABS = ['A','M'];
const TAB_NAME  = {A:'Aldi', M:'Meijer', P:'Days', D:'Dinners', F:'Fuel'};
const modeOf = t => SHOP_TABS.indexOf(t) >= 0 ? 'shop' : 'plan';
let lastTab = jget('v2.lastTab', {shop:'A', plan:'P'});

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const uid = () => 'x' + now().toString(36) + Math.random().toString(36).slice(2,7);
const persist = () => { jset('v2.ticks',ticks); jset('v2.extras',extras); jset('v2.dirty',dirty); jset('v2.hideChecked', hideChecked); };

function weeks(){ return (plan && plan.weeks) || []; }
function curWeek(){ const w = weeks(); return w[Math.min(wi, w.length-1)] || w[0]; }

/* Dynamic Header Height Calculation for Perfect Sticky Positioning on Safari */
function updateHeaderHeight(){
  const hdr = $('#hdr');
  if (hdr) {
    const h = hdr.offsetHeight;
    document.documentElement.style.setProperty('--hdr-h', h + 'px');
  }
}
window.addEventListener('resize', updateHeaderHeight);

/* Sync Backend Logic */
let syncing = false;
function setDot(){
  const d = $('#dot');
  const txt = $('#synctx');
  if (!cfg.url) {
    d.className = 'dot';
    txt.textContent = 'Local';
  } else if (syncing) {
    d.className = 'dot pend';
    txt.textContent = 'Syncing...';
  } else if (dirty) {
    d.className = 'dot pend';
    txt.textContent = 'Saving...';
  } else if (lastSync) {
    d.className = 'dot ok';
    txt.textContent = 'Synced';
  } else {
    d.className = 'dot err';
    txt.textContent = 'Offline';
  }
}

async function sync(push){
  if (!cfg.url || !cfg.key || syncing) { setDot(); return; }
  syncing = true; setDot();
  try {
    const base = cfg.url.replace(/\/+$/,'');
    const h = {'Content-Type':'application/json','X-List-Key':cfg.key};
    let r;
    if (push || dirty){
      r = await fetch(base + '/state', {method:'PUT', headers:h, body: JSON.stringify({ticks, extras})});
    } else {
      r = await fetch(base + '/state', {headers:h});
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    ticks  = s.ticks  || {};
    extras = s.extras || {};
    if (s.plan && Array.isArray(s.plan.weeks)) { plan = s.plan; jset('v2.plan', plan); }
    dirty = false;
    lastSync = new Date().toISOString();
    LS.set('v2.lastSync', lastSync);
    persist();
    render();
  } catch(e){
    lastSync = lastSync || '';
    $('#s_stat').textContent = 'Sync failed: ' + e.message;
  } finally {
    syncing = false; setDot();
  }
}

const queue = () => {
  dirty = true; persist(); setDot();
  clearTimeout(queue._t);
  queue._t = setTimeout(()=>sync(true), 1200);
};

/* Rendering UI */
/* ---- Shopping list normalisation --------------------------------------
   The plan groups a lot of items by recipe ("Mon 3 · Turkey chili"), which is
   how you cook but not how you walk a shop — 55% of items sat in recipe
   sections, and the same product appeared on several lines. shopList() folds
   those into real aisles and combines repeats into one line per product,
   summing the quantity when the units agree. The recipes are not lost: each
   item carries a note saying which meals it is for. */
const COOK_SEC = /\(cook (double|tonight)/i;

/* Order matters and there is no trailing \b: "carrot" has to match "Carrots",
   and \bcarrot\b does not. Jarred/canned goods are matched by phrase first so
   "Diced tomatoes" lands in the cupboard aisle while "Lettuce, tomato, onion"
   stays in produce. */
const AISLE_RULES = [
  [/\b(diced tomato|canned|marinara|salsa|broth|stock|soy sauce|seasoning|chili spice)/i, 'Canned & jarred'],
  [/\b(turkey|beef|pork|chicken|salmon|tilapia|fish|bacon|sausage|deli)/i, 'Meat & fish'],
  [/\b(cheddar|parmesan|mozzarella|butter|milk|yogurt|egg|cheese|cream)/i, 'Dairy & eggs'],
  [/\b(rice|pasta|ziti|penne|quinoa|tortilla|bun|roll|bread|cornbread|oats|granola|bagel|muffin|pita)/i, 'Bread & grains'],
  [/\b(green bean|potato|cabbage|carrot|lettuce|onion|pepper|broccoli|asparagus|brussels|sweet corn|vegetable|salad|avocado|garlic|ginger|greens|tomato|fruit|berr|apple|banana|orange|melon)/i, 'Produce'],
  [/\b(bean|sauce|honey|jam|oil|vinegar|spice|nut|almond|walnut)/i, 'Canned & jarred'],
];
const aisleFor = n => {
  for (const [re, sec] of AISLE_RULES) if (re.test(n)) return sec;
  return 'Also needed';
};

/* "2.5 cups dry" -> {n:2.5, u:"cups dry"}. Returns n:null when there is no number. */
function qtyParts(q){
  const m = String(q == null ? '' : q).trim().match(/^(\d+(?:\.\d+)?|\d+\/\d+)?\s*(.*)$/);
  if (!m) return { n: null, u: '' };
  let n = null;
  if (m[1]){
    n = m[1].indexOf('/') >= 0
      ? Number(m[1].split('/')[0]) / Number(m[1].split('/')[1])
      : Number(m[1]);
    if (!isFinite(n)) n = null;
  }
  return { n: n, u: (m[2] || '').trim() };
}

function combineQty(list){
  const raw = list.filter(q => String(q == null ? '' : q).trim() !== '');
  if (!raw.length) return '';
  if (raw.length === 1) return String(raw[0]).trim();
  const parts = raw.map(qtyParts);
  const units = [];
  parts.forEach(p => { if (units.indexOf(p.u.toLowerCase()) < 0) units.push(p.u.toLowerCase()); });
  if (units.length === 1 && parts.every(p => p.n !== null)){
    const sum = Math.round(parts.reduce((a, p) => a + p.n, 0) * 100) / 100;
    return sum + (parts[0].u ? ' ' + parts[0].u : '');
  }
  return raw.map(q => String(q).trim()).join(' + ');   // mixed units: show both
}

/* One line per product, grouped into the plan's own aisle order. */
function shopList(w, store){
  const secs = (w.lists && w.lists[store]) || [];
  const order = [];
  secs.forEach(s => { if (!COOK_SEC.test(s.sec) && order.indexOf(s.sec) < 0) order.push(s.sec); });

  const bag = new Map();
  secs.forEach(s => {
    const isCook = COOK_SEC.test(s.sec);
    const meal = isCook
      ? s.sec.replace(/\s*\(cook[^)]*\)\s*/i, '').replace(/^[^·]*·\s*/, '').trim()
      : '';
    s.items.forEach(it => {
      const name = String(it.n || '').trim();
      if (!name) return;
      const key = name.toLowerCase();
      let e = bag.get(key);
      if (!e){
        e = { n: name, sec: isCook ? aisleFor(name) : s.sec, fromCook: isCook,
              qs: [], c: 0, meals: [], note: it.note || '' };
        bag.set(key, e);
      } else if (!isCook && e.fromCook){
        e.sec = s.sec; e.fromCook = false;      // a real aisle beats a guessed one
      }
      e.qs.push(it.q);
      e.c += Number(it.c) || 0;
      if (meal && e.meals.indexOf(meal) < 0) e.meals.push(meal);
      if (!e.note && it.note) e.note = it.note;
    });
  });

  const bySec = new Map();
  bag.forEach(e => {
    e.q = combineQty(e.qs);
    if (!e.note && e.meals.length) e.note = 'For ' + e.meals.join(', ');
    if (order.indexOf(e.sec) < 0) order.push(e.sec);
    if (!bySec.has(e.sec)) bySec.set(e.sec, []);
    bySec.get(e.sec).push(e);
  });

  return order.filter(sec => bySec.has(sec)).map(sec => ({ sec: sec, items: bySec.get(sec) }));
}

/* A product is identified by week + store + name. Section and quantity are
   deliberately NOT in the key: both change when items are regrouped or
   combined, and that would silently detach every existing check-off. */
const tickKey = (weekId, store, name) => weekId + '|' + store + '|' + String(name).trim();

function chips(){
  $('#weeks').innerHTML = weeks().map((w,i) =>
    `<button class="chip${i===wi?' on':''}" data-w="${i}">${esc(w.label)}</button>`).join('');
  updateHeaderHeight();
}

function myExtras(weekId, store){
  return Object.entries(extras)
    .filter(([id,e]) => !e.deleted && e.week === weekId && e.store === store)
    .sort((a,b) => a[1].t - b[1].t);
}

function render(){
  const w = curWeek();
  if (!w){ $('#main').innerHTML = '<div class="empty">No plan loaded.</div>'; return; }
  
  const mode = modeOf(tab);

  /* Title says where you are; the eyebrow carries the week and its dates,
     which the old header never showed. No duplicating the chips below. */
  $('#wlab').textContent = TAB_NAME[tab] || 'Shopping';
  $('#hmeta').textContent = [
    w.label,
    w.dates || '',
    w.cooks ? w.cooks + ' cook nights' : ''
  ].filter(Boolean).join(' \u00b7 ');

  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === tab);
    b.hidden = modeOf(b.dataset.t) !== mode;
  });
  document.querySelectorAll('#modebar button').forEach(b =>
    b.classList.toggle('on', b.dataset.m === mode));

  $('#badd').style.display = (mode === 'shop') ? 'flex' : 'none';
  $('#bfilter').style.display = (mode === 'shop') ? 'flex' : 'none';
  
  // Filter button state
  const btnF = $('#bfilter');
  btnF.classList.toggle('active', hideChecked);
  $('#flab').textContent = hideChecked ? 'To Get Only' : 'All Items';

  const m = $('#main');

  if (tab === 'P'){
    // A week lists the calendar days it covers. Pantry has none, so it shows the whole block.
    const days = (plan.days||[]).filter(d => !w.days || !w.days.length || w.days.includes(d.d));
    m.innerHTML = days.length
      ? days.map(d => `<div class="dayblk">
          <div class="dayhd${d.cook?' cook':''}">
            <span class="dwd">${esc(d.wd)}</span><span class="ddn">${Number(d.d)||0}</span>
            <span class="dkind">${esc(d.kind)}${d.h ? ' · ' + (Number(d.h)||0) + ' h' : ''}</span>
            <span class="dkc">${Number(d.kc)||0}<i>kcal</i></span><span class="dcb">${Number(d.cb)||0}<i>g C</i></span>
          </div>
          ${(d.meals||[]).map(ml => `<div class="pmeal${/on the bike/i.test(ml.l||'')?' onbike':''}">
            <div class="pt">${esc(ml.t)}</div>
            <div class="px"><b>${esc(ml.l)}</b>${(ml.i||[]).map(it =>
              `<span class="pi"><i>${Number(it.c)||0}</i>${esc(it.n)}</span>`).join('')}<span class="pm">${Number(ml.kc)||0} kcal · ${Number(ml.cb)||0} g carb</span></div>
          </div>`).join('')}
        </div>`).join('')
      : '<div class="empty">No day plan for this week.</div>';
    totals(); updateHeaderHeight(); return;
  }

  if (tab === 'D'){
    m.innerHTML = (w.dinners||[]).length
      ? w.dinners.map(d => `<div class="din ${d.cook?'cook':'heat'}">
          <div class="d">${esc(d.d)}</div>
          <div class="x"><b>${esc(d.dish)}</b><span>${esc(d.tag)}</span></div>
          <div class="cc">${d.c ? '$'+d.c.toFixed(2) : '\u2014'}</div></div>`).join('')
      : '<div class="empty">No dinners planned for this week.</div>';
    totals(); updateHeaderHeight(); return;
  }
  
  if (tab === 'F'){
    m.innerHTML = (plan.fuel||[]).map(([h,p]) =>
      `<div class="card"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('')
      + `<div class="hint">Made at home, a month of ride fuel is about $12 vs $132 for branded gels.<br><br>Ingredients can appear under two cook nights — this is deliberate and total amounts add up.</div>`;
    totals(); updateHeaderHeight(); return;
  }

  const secs = shopList(w, tab);
  let html = (w.note && tab === 'A') ? `<p class="wnote">${esc(w.note)}</p>` : '';

  let sectionCount = 0;

  secs.forEach(s => {
    const cook = false;   // recipes are folded into aisles now; no cook sections in the list

    // Sort items so unchecked remain at top, checked move to bottom
    const itemsWithKeys = s.items.map(it => {
      const k = tickKey(w.id, tab, it.n);
      const on = ticks[k] && ticks[k].v;
      return { it, k, on };
    });

    const visibleItems = hideChecked ? itemsWithKeys.filter(x => !x.on) : itemsWithKeys;

    if (visibleItems.length > 0) {
      sectionCount++;
      html += `<div class="sech${cook?' cook':''}">${esc(s.sec)}</div>`;
      
      // Render unchecked first, then checked
      const sorted = hideChecked ? visibleItems : [...visibleItems].sort((a,b) => (a.on === b.on ? 0 : a.on ? 1 : -1));
      
      html += sorted.map(({it, k, on}) => {
        return `<div class="row${on?' done':''}" data-k="${esc(k)}" data-c="${Number(it.c) || 0}">
          <div class="box">\u2713</div>
          <div class="mid">
            ${it.q ? `<span class="q">${esc(it.q)}</span>`:''}
            <span class="n">${esc(it.n)}</span>
            ${it.note ? `<span class="note">${esc(it.note)}</span>`:''}
          </div>
          <div class="c">${it.c > 0 ? it.c.toFixed(2) : ''}</div>
        </div>`;
      }).join('');
    }
  });

  const mine = myExtras(w.id, tab);
  const visibleMine = mine.map(([id, e]) => {
    const k = 'x|' + id;
    const on = ticks[k] && ticks[k].v;
    return { id, e, k, on, c: Number(e.cost) || 0 };
  }).filter(x => !hideChecked || !x.on);

  if (visibleMine.length) {
    sectionCount++;
    html += `<div class="sech mine">Added by you</div>` + visibleMine.map(({id, e, k, on, c}) => {
      return `<div class="row${on?' done':''}" data-k="${esc(k)}" data-c="${c}">
        <div class="box">\u2713</div>
        <div class="mid">
          ${e.qty ? `<span class="q">${esc(e.qty)}</span>`:''}
          <span class="n">${esc(e.name)}</span>
        </div>
        <div class="c">${c ? c.toFixed(2) : ''}</div>
        <button class="del" data-del="${esc(id)}" aria-label="Delete item">\u00d7</button>
      </div>`;
    }).join('');
  }

  if (sectionCount === 0) {
    html += `<div class="empty">${hideChecked ? 'All items checked off!' : 'Nothing from ' + (tab==='M'?'Meijer':'Aldi') + ' this week.'}<br><br>Tap <b>+</b> to add an item.</div>`;
  }

  m.innerHTML = html;
  totals();
  updateHeaderHeight();
}

function totals(){
  let got = 0, left = 0, nLeft = 0;
  const w = curWeek();
  if (!w) return;

  // Calculate totals from entire list (including hidden items)
  shopList(w, tab).forEach(s => {
    s.items.forEach(it => {
      const k = tickKey(w.id, tab, it.n);
      const c = Number(it.c) || 0;
      if (ticks[k] && ticks[k].v) got += c; else { left += c; nLeft++; }
    });
  });

  myExtras(w.id, tab).forEach(([id, e]) => {
    const k = 'x|' + id;
    const c = Number(e.cost) || 0;
    if (ticks[k] && ticks[k].v) got += c; else { left += c; nLeft++; }
  });

  if (modeOf(tab) === 'shop'){
    const all = got + left;
    $('#got').textContent  = '$' + got.toFixed(2);
    $('#left').textContent = 'of $' + all.toFixed(2);
    $('#rem').textContent  = nLeft ? '\u00b7 ' + nLeft + ' to get' : (all ? '\u00b7 all done' : '');
    $('#prog').style.width = (all > 0 ? (got / all * 100) : 0) + '%';
  } else {
    /* Planning view: the week's whole basket, both stores, nothing checked off. */
    let planned = 0;
    ['A','M'].forEach(st => ((w.lists && w.lists[st]) || []).forEach(s =>
      s.items.forEach(it => { planned += Number(it.c) || 0; })));
    $('#got').textContent  = '$' + planned.toFixed(2);
    $('#left').textContent = 'planned for the week';
    $('#rem').textContent  = (w.days && w.days.length) ? '\u00b7 ' + w.days.length + ' days' : '';
    $('#prog').style.width = '100%';
  }
}

/* Haptic Feedback Helper for Store Usability */
function triggerHaptic(){
  if ('vibrate' in navigator) {
    try { navigator.vibrate(15); } catch(e){}
  }
}

/* Touch & Click Event Delegation */
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip){
    wi = Number(chip.dataset.w);
    LS.set('v2.week', wi);
    chips();
    render();
    window.scrollTo(0,0);
    return;
  }

  const mb = e.target.closest('#modebar button');
  if (mb){
    const m = mb.dataset.m;
    if (modeOf(tab) !== m){
      tab = lastTab[m] || (m === 'shop' ? 'A' : 'P');
      LS.set('v2.tab', tab);
      render();
      window.scrollTo(0,0);
      triggerHaptic();
    }
    return;
  }

  const tb = e.target.closest('#tabs button');
  if (tb){
    tab = tb.dataset.t;
    LS.set('v2.tab', tab);
    lastTab[modeOf(tab)] = tab;
    jset('v2.lastTab', lastTab);
    render();
    window.scrollTo(0,0);
    return;
  }

  if (e.target.closest('#bfilter')){
    hideChecked = !hideChecked;
    persist();
    render();
    triggerHaptic();
    return;
  }

  if (e.target.closest('#bsync')){ sync(false); triggerHaptic(); return; }
  
  if (e.target.closest('#bset')){
    $('#s_url').value = cfg.url;
    $('#s_key').value = cfg.key;
    $('#s_stat').textContent = lastSync ? 'Last synced ' + new Date(lastSync).toLocaleString() : 'Never synced';
    $('#setsheet').classList.add('open');
    return;
  }

  if (e.target.closest('#badd')){
    $('#ai_n').value = ''; $('#ai_q').value = ''; $('#ai_c').value = '';
    $('#ai_s').value = (tab === 'M') ? 'M' : 'A';
    $('#addsheet').classList.add('open');
    setTimeout(()=> $('#ai_n').focus(), 150);
    return;
  }

  if (e.target.closest('[data-close]') || e.target.classList.contains('sheet')){
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    return;
  }

  if (e.target.closest('#s_go')){
    cfg = {url: $('#s_url').value.trim(), key: $('#s_key').value.trim()};
    jset('v2.cfg', cfg);
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    sync(false);
    return;
  }

  if (e.target.closest('#ai_go')){
    const n = $('#ai_n').value.trim().slice(0,200);
    if (!n) return;
    const id = uid();
    extras[id] = {
      name: n,
      qty: $('#ai_q').value.trim().slice(0,200),
      cost: parseFloat($('#ai_c').value) || 0,
      store: $('#ai_s').value,
      week: curWeek().id,
      t: now()
    };
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    persist();
    queue();
    render();
    triggerHaptic();
    return;
  }

  const del = e.target.closest('[data-del]');
  if (del){
    e.stopPropagation();
    const id = del.dataset.del;
    extras[id] = {...extras[id], deleted: true, t: now()};
    persist();
    queue();
    render();
    triggerHaptic();
    return;
  }

  if (e.target.closest('#reset')){
    const w = curWeek();
    if (confirm('Clear all checked items for ' + w.label + '?')) {
      Object.keys(ticks).forEach(k => {
        if (k.startsWith(w.id + '|')) ticks[k] = {v: false, t: now()};
      });
      persist();
      queue();
      document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
      render();
      triggerHaptic();
    }
    return;
  }

  const row = e.target.closest('.row');
  if (row){
    const k = row.dataset.k;
    const on = !(ticks[k] && ticks[k].v);
    ticks[k] = {v: on, t: now()};
    
    // Haptic feedback & instant animation
    triggerHaptic();
    row.classList.toggle('done', on);
    
    persist();
    queue();
    
    // If filter mode is hiding checked items, re-render smoothly
    if (hideChecked) {
      setTimeout(() => render(), 180);
    } else {
      totals();
    }
  }
});

/* Re-sync when returning to app foreground */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) sync(dirty);
});
window.addEventListener('online', () => sync(dirty));

/* Init */
chips();
render();
setDot();
updateHeaderHeight();

if (cfg.url && cfg.key) sync(dirty);
</script>
</body>
</html>
