/* Ingredients for a dish, gathered from BOTH store lists — a couple of dishes
   have one item on the Meijer list and the rest on Aldi. */
function dishIngredients(w, dish){
  const out = [];
  ['A','M'].forEach(st => ((w.lists && w.lists[st]) || []).forEach(s => {
    if (!COOK_SEC.test(s.sec)) return;
    const nm = s.sec.replace(/\s*\(cook[^)]*\)\s*/i, '').replace(/^[^·]*·\s*/, '').trim();
    if (nm === dish) s.items.forEach(it => out.push({ n: it.n, q: it.q, c: it.c, store: st }));
  }));
  return out;
}

const reheatDays = (w, dish) =>
  (w.dinners || []).filter(x => !x.cook && x.dish === dish).map(x => x.d);

/* A product is identified by week + store + name. Section and quantity are
   deliberately NOT in the key: both change when items are regrouped or
   combined, and that would silently detach every existing check-off. */
const tickKey = (weekId, name) => weekId + '|' + String(name).trim();
/* Added items keep their own id so renaming or re-adding cannot collide with
   a plan item. render() and totals() MUST agree on this or the budget drifts. */
const rowKey = (weekId, it) => it.extraId ? 'x|' + it.extraId : tickKey(weekId, it.n);

function chips(){
  $('#weeks').innerHTML = weeks().map((w,i) =>
    `<button class="chip${i===wi?' on':''}" data-w="${i}">${esc(weekLabel(w))}</button>`).join('');
  updateHeaderHeight();
}

/* Everything this household has ever put on a list, for type-ahead. They buy
   the same couple of hundred things, so suggesting from their own history beats
   any generic product catalogue. */
function itemCorpus(){
  const set = new Set();
  weeks().forEach(wk => ['A','M'].forEach(st =>
    ((wk.lists && wk.lists[st]) || []).forEach(s =>
      s.items.forEach(it => { if (it.n) set.add(String(it.n).trim()); }))));
  Object.keys(extras).forEach(id => { const e = extras[id]; if (e && e.name) set.add(String(e.name).trim()); });
  return [...set].sort((a, b) => a.localeCompare(b));
}

function myExtras(weekId){
  return Object.entries(extras)
    .filter(([id,e]) => !e.deleted && e.week === weekId)
    .sort((a,b) => a[1].t - b[1].t);
}

/* Intensity is ordinal, so it maps to one ordered ramp rather than five hues.
   Rest gets the neutral step and no bar. */
const KIND_STEP = { 'rest day':0, 'moderate day':1, 'loading day':2, 'key day':3, 'long day':4 };
const stepOf = k => KIND_STEP[String(k || '').toLowerCase()] || 0;
/* Short enough for a 50px cell, so the day says what it is rather than relying
   on the reader decoding a colour. */
const KIND_SHORT = { 'rest day':'rest', 'moderate day':'mod', 'loading day':'load',
                     'key day':'key', 'long day':'long' };
const shortKind = k => KIND_SHORT[String(k || '').toLowerCase()] || String(k || '').split(' ')[0].toLowerCase();

/* The day-by-day eating plan: every meal, its time, what is in it, what it adds
   up to. Rendered in the Fuel tab beside the training it is fuelling. */
/* The plan lists a repeated food as two identical lines — "1 cup RICE" twice
   rather than "2 cups RICE" once — on 17 meals in this block. The totals already
   count both, so the food is right and only the reading is confusing. Combine
   them for display; the underlying plan is untouched. */
const UNIT_PLURAL = { cup:'cups', tablespoon:'tablespoons', teaspoon:'teaspoons',
  slice:'slices', bottle:'bottles', bar:'bars', package:'packages', pack:'packs',
  ear:'ears', scoop:'scoops', egg:'eggs', each:'each' };

function combineMealItems(items){
  const order = [];
  const by = new Map();
  (items || []).forEach(it => {
    const key = String(it.n || '');
    if (!by.has(key)) { by.set(key, { n: key, c: 0, k: 0 }); order.push(key); }
    const e = by.get(key);
    e.c += Number(it.c) || 0;
    e.k += 1;
  });
  return order.map(key => {
    const e = by.get(key);
    if (e.k < 2) return { n: e.n, c: e.c };
    /* Multiply the leading count: "1 cup RICE" x2 -> "2 cups RICE". */
    const m = e.n.match(/^(\d+(?:\.\d+)?)\s+(\S+)\s+([\s\S]+)$/);
    if (!m) return { n: e.k + ' x ' + e.n, c: e.c };
    const qty = Number(m[1]) * e.k;
    const unit = qty > 1 ? (UNIT_PLURAL[m[2].toLowerCase()] || m[2]) : m[2];
    return { n: qty + ' ' + unit + ' ' + m[3], c: e.c };
  });
}

/* Which day of the month is today, but only if today actually falls inside the
   block this plan covers — otherwise nothing is "today" and nothing is pinned. */
function todayInBlock(){
  const b = String((plan && plan.block) || '');
  const now = new Date();
  const month = now.toLocaleString('en-US', { month: 'long' });
  if (b.indexOf(month) < 0 || b.indexOf(String(now.getFullYear())) < 0) return 0;
  return now.getDate();
}

/* The week containing today, so the app opens where you are rather than on
   whichever week happened to be first. */
function weekIndexOfToday(){
  const t = todayInBlock();
  if (!t) return -1;
  const ws = weeks();
  for (let i = 0; i < ws.length; i++){
    if (Array.isArray(ws[i].days) && ws[i].days.indexOf(t) >= 0) return i;
  }
  return -1;
}

function dayBlocks(w){
  let days = (plan.days || []).filter(d => !w.days || !w.days.length || w.days.indexOf(d.d) >= 0);
  if (!days.length) return '<div class="empty">No day plan for this week.</div>';
  /* Today first, so the day you are actually living is not four screens down. */
  const today = todayInBlock();
  if (today && days.some(d => d.d === today)){
    days = days.slice().sort((a, b) => (b.d === today) - (a.d === today));
  }
  const train = {};
  (plan.training || []).forEach(t => { train[t.d] = t; });
  return days.map(d => {
    const t = train[d.d] || {};
    const hh = Number(t.h) || Number(d.h) || 0;
    const bk = t.bk || null;
    /* Grams per hour is the number you actually ride to; the on-bike meal below
       lists what to carry to hit it. */
    const perHr = (bk && hh) ? Math.round((Number(bk.cb) || 0) / hh) : 0;
    const ride = hh > 0
      ? `<div class="pmeal rideline">
           <div class="pt">Ride</div>
           <div class="px"><b>${esc(t.kind || d.kind || 'Ride')} &middot; ${hh} h</b>
             ${bk ? `<span class="pi"><i>${Number(bk.cb) || 0}g</i>carb on the bike &middot; ${Number(bk.kc) || 0} kcal</span>` : ''}
             ${perHr ? `<span class="pm">about ${perHr} g carb an hour</span>` : ''}
           </div>
         </div>`
      : `<div class="pmeal rideline rest">
           <div class="pt">Rest</div>
           <div class="px"><b>No riding</b><span class="pm">eat to the day's totals, no bottle needed</span></div>
         </div>`;
    const isToday = today && d.d === today;
    return `<div class="dayblk${isToday ? ' istoday' : ''}">
          ${isToday ? '<div class="todaytag">Today</div>' : ''}
          <div class="dayhd${d.cook?' cook':''}">
            <span class="dwd">${esc(d.wd)}</span><span class="ddn">${Number(d.d)||0}</span>
            <span class="dkind">${esc(d.kind)}${d.h ? ' · ' + (Number(d.h)||0) + ' h' : ''}</span>
            <span class="dkc">${Number(d.kc)||0}<i>kcal</i></span><span class="dcb">${Number(d.cb)||0}<i>g C</i></span>
          </div>
          ${ride}
          ${(d.meals||[]).map(ml => `<div class="pmeal${/on the bike/i.test(ml.l||'')?' onbike':''}">
            <div class="pt">${esc(ml.t)}</div>
            <div class="px"><b>${esc(ml.l)}</b>${combineMealItems(ml.i).map(it =>
              `<span class="pi"><i>${Number(it.c)||0}</i>${esc(it.n)}</span>`).join('')}<span class="pm">${Number(ml.kc)||0} kcal · ${Number(ml.cb)||0} g carb</span></div>
          </div>`).join('')}
        </div>`;
  }).join('');
}

/* The rider this plan is written for. Carbohydrate guidance is per kilogram,
   so the grid cannot be drawn without it. */
const RIDER_KG = 67.1;

/* Axis top and the two band edges, in g/kg. 3-5 low / 6-8 moderate / 8-12 high
   is the standard carbohydrate-periodisation scale; those numbers come from
   outside this data set, which is what makes bar length absolutely readable
   rather than only readable against this block's own maximum. */
const CG_MAX = 12, CG_MOD = 6, CG_HIGH = 8;

/* Measured off this block: table carbohydrate is nearly constant while bottle
   carbohydrate is not. That is the single most useful thing the grid has to
   say, so it is also said in words under it. */
const FLAT_LO = 4.0, FLAT_HI = 6.4;

const KIND_LONG = { 'rest day':'rest day', 'moderate day':'moderate day',
                    'loading day':'loading day', 'key day':'key day', 'long day':'long day' };
const kindLong = k => KIND_LONG[String(k || '').toLowerCase()] || 'training day';
const bandName = g => g < CG_MOD ? 'Low' : g < CG_HIGH ? 'Moderate' : 'High';

/* Month of the block, so a day-of-month becomes a real ISO date. dnum()/dayOf()
   elsewhere key on day-of-month alone and alias September onto August; this
   grid does not, because it builds the date from the block itself. */
const MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
function blockYM(){
  const b = String((plan && plan.block) || '');
  const mi = MONTHS.findIndex(m => b.indexOf(m) >= 0);
  const y  = (b.match(/\b(20\d{2})\b/) || [])[1];
  if (mi < 0 || !y) return null;
  return y + '-' + String(mi + 1).padStart(2, '0');
}

/* Total carbohydrate for a day. The day-level cb field disagrees with the sum
   of its own meals on 13 of 31 days, so the meals win: they are what the day
   view shows and what a tap logs against. */
function dayCarb(day){
  return ((day && day.meals) || []).reduce((a, m) => a + (Number(m.cb) || 0), 0);
}

/* How much of the day's carbohydrate has been logged as eaten, weighted by
   carbohydrate rather than by meal count, because this chart is about carbs.
   Returns null when nothing has been logged at all -- which is a different
   fact from "logged, ate none of it", and the two must stay distinguishable. */
const isoDay = (d) => { const ym = blockYM(); return ym ? ym + '-' + String(d).padStart(2, '0') : ''; };

/* Every ride in the block, fetched once and indexed by date. The Worker
   edge-caches this for ten minutes, so opening the Fuel tab repeatedly cannot
   turn into traffic against intervals.icu. Failure is a state, not an
   exception: the grid draws the plan with or without it. */
let block = { state: 'idle', by: {} };

async function loadBlockRides(){
  if (block.state === 'load' || block.state === 'ok') return;
  const ds = (plan.training || []).map(x => Number(x.d) || 0).filter(Boolean);
  if (!ds.length) return;
  block = { state: 'load', by: {} };
  try {
    const r = await api('/rides?oldest=' + isoDay(Math.min(...ds)) + '&newest=' + isoDay(Math.max(...ds)));
    if (!r || !r.ok) throw new Error((r && r.why) || 'unavailable');
    const by = {};
    (r.rides || []).forEach(rd => {
      const k = String(rd.date || '').slice(0, 10);
      if (!k) return;
      const e = by[k] || (by[k] = { secs: 0, kcal: 0, meas: true, n: 0 });
      e.n += 1; e.secs += Number(rd.secs) || 0; e.kcal += Number(rd.kcal) || 0;
      if (rd.trust !== 'measured') e.meas = false;
    });
    block = { state: 'ok', by: by };
  } catch { block = { state: 'err', by: {} }; }
  if (tab === 'F') render();
}

/* Measured intensity in four steps, with 600 kcal/h — the rate every calorie
   target in the plan is built on — as a boundary rather than a value inside a
   band. So the two darker steps are exactly the rides that earned their food. */
const rideStep = (kph) => kph >= 750 ? 4 : kph >= 600 ? 3 : kph >= 450 ? 2 : 1;

function carbAdherence(iso, day){
  const meals = (day && day.meals) || [];
  let any = false, done = 0, all = 0;
  meals.forEach(m => {
    const cb = Number(m.cb) || 0;
    all += cb;
    if (Object.prototype.hasOwnProperty.call(mealLog, logKey(iso, m.t))){
      any = true;
      done += cb * ateOf(iso, m.t);
    }
  });
  if (!any || !all) return null;
  return Math.max(0, Math.min(1, done / all));
}

/* The block at a glance, as the carbohydrate story.
   Colour is categorical (two sources of carbohydrate); geometry is one
   quantity split into those two parts. Nothing here touches the network: the
   grid is drawn from the bundled plan and from taps held in localStorage, so
   it is complete and correct while intervals.icu is down, slow, or has never
   been reachable once. */
function monthGrid(){
  const t = plan.training || [];
  if (!t.length) return '';
  const ym   = blockYM();
  const WD   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const idx  = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6 };
  const lead = idx[t[0].wd] || 0;
  const todayD = todayInBlock();

  /* One scale for every day, so an over-delivered ride cannot clip its track. */
  const HMAX = Math.max(1, ...t.map(z => Number(z.h) || 0),
    ...Object.values(block.by || {}).map(a => a.secs / 3600));

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span class="cgc pad" aria-hidden="true"></span>');

  t.forEach(x => {
    const dn     = Number(x.d) || 0;
    const iso    = ym ? ym + '-' + String(dn).padStart(2, '0') : '';
    const day    = (plan.days || []).find(z => z.d === dn);
    const total  = dayCarb(day);
    const bottle = Math.min(total, Number(x.bk && x.bk.cb) || 0);
    const gkg    = total / RIDER_KG;

    /* Percentages, computed here from numbers. None of them can carry markup. */
    const hPct = Math.max(0, Math.min(100, gkg / CG_MAX * 100));
    const bPct = total > 0 ? Math.max(0, Math.min(100, bottle / total * 100)) : 0;

    /* Riding, actual against planned, on one scale for all 31 days. */
    const act  = (block.state === 'ok' && iso) ? (block.by[iso] || null) : null;
    const kph  = act && act.secs ? act.kcal / (act.secs / 3600) : 0;
    const rPct = act ? Math.max(0, Math.min(100, (act.secs / 3600) / HMAX * 100)) : 0;
    const pPct = Math.max(0, Math.min(100, (Number(x.h) || 0) / HMAX * 100));
    /* Four states. A ride still to come is drawn at its planned height in
       outline, so a big Saturday two weeks out is visible as a big Saturday —
       the old bar showed a 2px hairline on an empty track, which reads as
       nothing at all. Hollow means not yet; empty means it did not happen. */
    const rideState = act ? 'done'
                    : (Number(x.h) || 0) === 0 ? 'none'
                    : (todayD > 0 && dn < todayD && block.state === 'ok') ? 'miss'
                    : 'todo';

    const ad    = iso ? carbAdherence(iso, day) : null;
    const past  = todayD > 0 && dn <= todayD;
    /* Today is not a missed session at three in the afternoon — he rides at
       six. A day is only unridden once it is over. */
    const gone  = todayD > 0 && dn < todayD;
    const isNow = todayD > 0 && dn === todayD;
    const hrs   = Number(x.h) || 0;

    const label = dn + ' ' + String(x.wd || '') + ', ' + kindLong(x.kind) + ', '
      + (hrs > 0 ? hhm(hrs) + ' riding' : 'no riding') + '. '
      + bandName(gkg) + ' carbohydrate day, ' + Math.round(total) + ' grams, which is '
      + gkg.toFixed(1) + ' per kilogram of bodyweight: '
      + ((total - bottle) / RIDER_KG).toFixed(1) + ' at the table, '
      + (bottle / RIDER_KG).toFixed(1) + ' on the bike.'
      + (act ? ' Ridden ' + hhm(act.secs / 3600) + ' at ' + Math.round(kph) + ' kilocalories an hour.'
             : rideState === 'miss' ? ' Not ridden.'
             : rideState === 'todo' ? ' Still to come.' : '')
      + (past ? (ad === null ? ' Nothing logged yet.'
                             : ' ' + Math.round(ad * 100) + ' percent logged as eaten.')
              : ' Not yet.');

    cells.push(`<button class="cgc${isNow ? ' today' : ''}" role="listitem" data-cgday="${esc(iso)}" aria-label="${esc(label)}">`
      + `<span class="cgd" aria-hidden="true">${Number(dn)}</span>`
      + `<span class="cgstack" aria-hidden="true">`
        + `<span class="cgbar" data-h="${hPct.toFixed(1)}" data-bp="${bPct.toFixed(1)}">`
          + `<span class="cgb"></span><span class="cgt"></span>`
        + `</span>`
        /* The ride beside the food: track is the block's longest day, the
           hairline is what was planned, the fill is what was actually ridden,
           and its shade is the measured rate. Geometry is time and colour is a
           rate, so neither restates the other. */
        + `<span class="cgr ${rideState}${act ? ' s' + rideStep(kph) : ''}${act && !act.meas ? ' est' : ''}"`
        + ` data-rh="${(act ? rPct : pPct).toFixed(1)}" data-rp="${pPct.toFixed(1)}">`
          + (hrs > 0 || act ? `<span class="cgrf"></span>` : '')
          + (hrs > 0 && act ? `<span class="cgrp"></span>` : '')
        + `</span>`
      + `</span>`
      + `<span class="cgv" aria-hidden="true">${Math.round(total)}<u>g</u>`
      + (act ? `<b>${(act.secs / 3600).toFixed(1)}h</b>`
             : rideState === 'miss' ? `<s>&mdash;</s>`
             : rideState === 'todo' ? `<em>${hrs.toFixed(1)}h</em>` : '')
      + `</span>`
      /* Three different facts, three different marks. No track at all = the day
         has not happened. Dashed empty track = it happened and nothing was
         logged. Solid track = it was logged, and the fill is how much of the
         carbohydrate was actually eaten -- including a solid, empty track for
         "logged, ate none of it", which is not the same as never having looked. */
      + (past
          ? (ad === null
              ? `<span class="cgtrack untracked" aria-hidden="true"></span>`
              : `<span class="cgtrack" aria-hidden="true"><span class="cgfill" data-ad="${(ad * 100).toFixed(0)}"></span></span>`)
          : '')
      + `</button>`);
  });

  return `<div class="cgwrap">
    <div class="cggrid" aria-hidden="true">${WD.map(d => `<div class="cghead">${esc(d)}</div>`).join('')}</div>
    <div class="cggrid" role="list">${cells.join('')}</div>
    <div class="cglegend">
      <span class="cgspec" aria-hidden="true"><span class="cgstack">
        <span class="cgbar" data-h="90" data-bp="44"><span class="cgb"></span><span class="cgt"></span></span>
      </span></span>
      <span class="cgkeys">
        <span><i class="kt"></i><b>Table</b></span>
        <span><i class="kb"></i><b>Bottle</b></span>
        <span><i class="ka"></i><b>Eaten</b></span>
      </span>
      <span class="cgkeys">
        <span><b>Lines</b> ${Math.round(6 * RIDER_KG)} &amp; ${Math.round(8 * RIDER_KG)}&thinsp;g &mdash; moderate, then high</span>
      </span>
    </div>
    <p class="cgnote"><b>The number is grams of carbohydrate for that day</b>, and the bar
      splits it by where it comes from: solid is food you eat at the table, hatched is what
      goes in the bottle on the bike. The kitchen barely moves across the whole block
      (${Math.round(FLAT_LO * RIDER_KG)}&ndash;${Math.round(FLAT_HI * RIDER_KG)}&thinsp;g) &mdash;
      what makes a day big is the bottle.<br>
      The bar beside it is the ride: the line across it is the time the plan asked for and the
      fill is what you actually rode, shaded darker the harder it was. A bar with no track
      under it is a day that has not happened yet.</p>
  </div>`;
}

/* Sizes are custom properties assigned from script, never a style attribute:
   the CSP is hash-only, so an inline style is silently dropped -- which is
   exactly how the macro bars ended up rendering at zero width. */
function paintMonth(){
  document.querySelectorAll('.cgr[data-rh]').forEach(r => {
    r.style.setProperty('--rh', (Number(r.dataset.rh) || 0) + '%');
    r.style.setProperty('--rp', (Number(r.dataset.rp) || 0) + '%');
  });
  document.querySelectorAll('.cgbar[data-h]').forEach(b => {
    b.style.setProperty('--h',  (Number(b.dataset.h)  || 0) + '%');
    b.style.setProperty('--bp', (Number(b.dataset.bp) || 0) + '%');
  });
  document.querySelectorAll('.cgfill[data-ad]').forEach(f => {
    f.style.setProperty('--ad', (Number(f.dataset.ad) || 0) + '%');
  });
}

/* ---- Today, planned against ridden -------------------------------------
   Ride data is cheap and cached at the edge, so it loads on its own. Advice
   costs money and takes a few seconds, so it only ever happens on a tap. */
let coach = { day: '', rides: null, advice: null, facts: null, busy: false, err: '' };
let look  = { data: null, stats: null, busy: false, err: '' };
/* One day's actual riding. Keyed by date so moving through the week refetches. */
let dayRide = { day: '', rides: null, read: null, busy: false, err: '' };

function todayKey(){
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0')
       + '-' + String(n.getDate()).padStart(2, '0');
}

async function api(pathq){
  const base = (cfg.url || '').replace(/\/+$/, '');
  if (!base || !cfg.key) throw new Error('not connected');
  const r = await fetch(base + pathq, { headers: { 'X-List-Key': cfg.key } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

async function loadRides(){
  const d = todayKey();
  if (coach.day === d && coach.rides) return;
  try {
    const r = await api('/rides?oldest=' + d + '&newest=' + d);
    coach = { ...coach, day: d, rides: r.ok ? r.rides : [], err: r.ok ? '' : '' };
  } catch { coach = { ...coach, day: d, rides: [] }; }
  if (tab === 'F') render();
}

async function runCoach(){
  if (coach.busy) return;
  coach.busy = true; coach.err = ''; render();
  const n = new Date();
  const hhmm = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
  try {
    const r = await api('/coach?date=' + todayKey() + '&now=' + hhmm);
    if (r.ok) { coach.advice = r.advice; coach.facts = r.facts; }
    else coach.err = r.why || 'unavailable';
  } catch (e) { coach.err = e.message; }
  coach.busy = false; render();
}

async function loadDayRides(d){
  if (dayRide.day === d && dayRide.rides !== null) return;
  dayRide = { day: d, rides: null, read: null, busy: false, err: '' };
  try {
    const r = await api('/ride?date=' + d);
    dayRide.rides = r.ok ? (r.rides || []) : [];
  } catch { dayRide.rides = []; }
  if (tab === 'F') render();
}

async function readRide(){
  if (dayRide.busy) return;
  dayRide.busy = true; dayRide.err = ''; render();
  try {
    const r = await api('/ride?date=' + dayRide.day + '&why=1');
    if (r.ok) dayRide.read = r.advice; else dayRide.err = r.why || 'unavailable';
  } catch (e) { dayRide.err = e.message; }
  dayRide.busy = false; render();
}

/* The open-ended shape both analysts return: a headline, however many sections
   the data warranted, what to do, and what the data cannot say. */
function sectionsHtml(a){
  return `<p class="ahead">${esc(a.headline)}</p>`
    + (a.sections || []).map(x =>
        `<div class="asec"><b>${esc(x.title)}</b><span>${esc(x.body)}</span></div>`).join('')
    + ((a.do_next || []).length
        ? `<div class="asec"><b>Do next</b><span>` + a.do_next.map(x => `&bull; ${esc(x)}`).join('<br>') + `</span></div>`
        : '')
    + (a.caveat ? `<p class="afoot">${esc(a.caveat)}</p>` : '');
}

/* What he actually did that day, whether or not he asks anything about it. */
function rideDetail(){
  if (dayRide.day !== selDay) return '';
  const rs = dayRide.rides;
  if (rs === null) return `<div class="card coach"><p class="anone">Loading your ride&hellip;</p></div>`;
  if (!rs.length) return '';
  const big = rs.slice().sort((a,b) => b.secs - a.secs)[0];
  const stat = (v, l) => v ? `<div class="rst"><b>${v}</b><i>${l}</i></div>` : '';
  let out = `<div class="card coach"><div class="rname">${esc(big.name || big.type)}</div>`
    + `<div class="rstats">`
    + stat(hhm(big.secs/3600), 'moving')
    + stat(big.km ? big.km + ' km' : '', 'distance')
    + stat(big.up ? big.up + ' m' : '', 'climbing')
    + stat(big.kcal ? big.kcal + '' : '', 'kcal ' + (big.trust === 'measured' ? 'measured' : 'estimated'))
    + stat(big.watts ? big.watts + ' W' : '', big.np ? 'avg &middot; ' + big.np + ' W np' : 'average')
    + stat(big.hr ? big.hr + '' : '', 'avg bpm')
    + stat(big.load ? big.load + '' : '', 'load')
    + stat(big.pwhr ? big.pwhr + '' : '', 'W per bpm')
    + `</div>`;
  if (rs.length > 1) out += `<p class="anone">and ${rs.length - 1} shorter ${rs.length === 2 ? 'ride' : 'rides'} that day</p>`;
  out += `<button id="ride_go" class="cbtn"${dayRide.busy ? ' disabled' : ''}>${dayRide.busy ? 'Reading it&hellip;' : (dayRide.read ? 'Read it again' : 'What was this ride?')}</button>`;
  if (dayRide.err) out += `<p class="cerr">${esc(dayRide.err)}</p>`;
  if (dayRide.read) out += `<div class="adv">${sectionsHtml(dayRide.read)}</div>`;
  return out + `</div>`;
}

async function runAnalyze(){
  if (look.busy) return;
  look.busy = true; look.err = ''; render();
  try {
    const r = await api('/analyze?to=' + todayKey() + '&weeks=6');
    if (r.ok) { look.data = r.advice; look.stats = r.stats; }
    else look.err = r.why || 'unavailable';
  } catch (e) { look.err = e.message; }
  look.busy = false; render();
}

function analysisCard(){
  let out = `<div class="sech">How the training is going</div><div class="card coach">`;
  const st = look.stats;
  if (st && st.weeks && st.weeks.length){
    out += `<div class="wks">` + st.weeks.slice(-6).map(w =>
      `<div class="wk${w.partial ? ' part' : ''}"><i>${esc(w.week.slice(5))}</i>`
      + `<b>${w.hours}h</b><span>${w.ride_days}d &middot; ${w.watts_per_bpm || '&mdash;'} W/bpm</span></div>`).join('')
      + `</div>`;
    if (st.efficiency_trend_pct !== null && st.efficiency_trend_pct !== undefined)
      out += `<p class="wtrend">Watts per heartbeat over the last complete weeks: <b class="${st.efficiency_trend_pct < 0 ? 'dn' : 'up'}">${st.efficiency_trend_pct > 0 ? '+' : ''}${st.efficiency_trend_pct}%</b>. More power at the same heart rate is fitness; the week in progress is left out because it is not finished.</p>`;
  }
  out += `<button id="look_go" class="cbtn"${look.busy ? ' disabled' : ''}>${look.busy ? 'Reading the data&hellip;' : (look.data ? 'Look again' : 'Analyse my training')}</button>`;
  if (look.err) out += `<p class="cerr">${esc(look.err)}</p>`;
  if (look.data){
    out += `<div class="adv">${sectionsHtml(look.data)}</div>`;
  }
  return out + `</div>`;
}

const hhm = (h) => { const t = Math.round(h * 60); return t >= 60 ? (t / 60 | 0) + 'h ' + (t % 60) + 'm' : t + 'm'; };

/* Which day the Fuel tab is showing. Defaults to today, moves with the strip. */
let selDay = '';

const DOW = ['S','M','T','W','T','F','S'];
const dnum = (d) => Number(d.slice(8,10));
/* The block is one month, and days are keyed by day-of-month alone. When the
   last week of the block straddles into the next month — August 31 2026 is a
   Monday, so its strip runs to September 6 — a bare day-of-month lookup hands
   back the wrong month's food: September 3 would offer August 3's chili, and a
   tap would log against a day that does not exist in the plan. Gate on the
   month named in plan.block. */
const BLK_MONTHS = ['january','february','march','april','may','june','july',
                    'august','september','october','november','december'];
function inBlock(key){
  const m = /([A-Za-z]+)\s+(\d{4})/.exec(String((plan && plan.block) || ''));
  if (!m) return true;                       // no block label: behave as before
  const mi = BLK_MONTHS.indexOf(m[1].toLowerCase());
  if (mi < 0) return true;
  return Number(key.slice(0,4)) === Number(m[2]) && Number(key.slice(5,7)) === mi + 1;
}
const dayOf = (d) => (inBlock(d) ? (plan.days || []).find(x => x.d === dnum(d)) : undefined);

/* Meal times are '6:15 am'; the timeline wants 06:15 and a sort order. */
function mins(t){
  const m = /^(\s*)(\d{1,2}):(\d{2})\s*(am|pm)$/i.exec(String(t||''));
  if (!m) return 24*60;
  let h = Number(m[2]) % 12; if (/pm/i.test(m[4])) h += 12;
  return h*60 + Number(m[3]);
}
const clock = (mm) => String(mm/60|0).padStart(2,'0') + ':' + String(mm%60).padStart(2,'0');

const logKey = (d, t) => d + '|' + t;
const ateOf  = (d, t) => { const e = mealLog[logKey(d,t)]; return e ? Number(e.v) || 0 : 0; };

function setAte(d, t, v){
  mealLog[logKey(d,t)] = { v, t: Date.now() };
  dirty = true; persist(); queue(); triggerHaptic(); render();
}

function weekStrip(){
  const sel = new Date(selDay + 'T12:00:00');
  const mon = new Date(sel); mon.setDate(sel.getDate() - ((sel.getDay() + 6) % 7));
  let out = '';
  for (let i = 0; i < 7; i++){
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const has = !!dayOf(key);
    out += `<button class="hxd${key === selDay ? ' on' : ''}${key === todayKey() ? ' now' : ''}${has ? '' : ' off'}" data-day="${esc(key)}">`
         + `<i>${DOW[d.getDay()]}</i><b>${d.getDate()}</b></button>`;
  }
  return `<div class="hxwk">${out}</div>`;
}

/* Carbohydrate as a share of the meal's own calories, in three ordinal steps.
   It is the only per-meal nutrient the plan actually knows, and it is what the
   whole block is for, so it is what the rail encodes. */
function carbStep(m){
  if (!m.kc) return 1;
  const share = (4 * (Number(m.cb) || 0)) / m.kc;
  return share >= 0.55 ? 3 : share >= 0.35 ? 2 : 1;
}

function dayHead(day, tr, sum){
  const dkc = Number(day.kc) || 0, dcb = Number(day.cb) || 0;
  /* days[].kc disagrees with its own meals on 19 of 31 days and days[].cb on
     13. Sum the meals, and say so where the day total dissents rather than
     silently picking a winner. */
  const drift = (dkc && dkc !== sum.kc) || (dcb && dcb !== sum.cb);
  return `<div class="hxday">`
    + `<span class="hxdate"><i>${esc(day.wd)}</i><b>${Number(day.d) || 0}</b></span>`
    + `<span class="hxwhat"><b>${esc(day.kind)}</b>`
    + `<em>${tr && tr.h ? esc(hhm(tr.h)) + ' planned' : 'no riding'}</em></span>`
    + (day.dish ? `<span class="hxcook">Cook</span>` : '')
    + `</div>`
    + `<p class="hxsum">${day.meals.length} meals &middot; ${sum.kc} kcal &middot; ${sum.cb} g carb`
    + (drift ? `<s>day total says ${dkc} kcal / ${dcb} g</s>` : '') + `</p>`;
}

/* Calories and carbohydrate are exact — every meal carries both. Protein and
   fat exist ONLY as day totals, so they are apportioned by calorie share, and
   those two tiles are starred and drawn hatched. An estimate must not be able
   to pass for a measurement just because it is rendered the same way. */
function macroRow(day, sum, eaten){
  const share = sum.kc ? eaten.kc / sum.kc : 0;
  const pr = Number(day.pr) || 0, ft = Number(day.ft) || 0;
  const fatLow = sum.kc > 0 && (9 * ft) / sum.kc < 0.20;
  const tiles = [
    ['kcal', Math.round(eaten.kc),   sum.kc, '',  ''],
    ['C',    Math.round(eaten.cb),   sum.cb, 'g', ''],
    ['P',    Math.round(pr * share), pr,     'g', 'est'],
    ['F',    Math.round(ft * share), ft,     'g', fatLow ? 'est low' : 'est'],
  ];
  return `<div class="hxmac">` + tiles.map(([k, v, t, u, cls]) =>
      `<div class="hxm${cls ? ' ' + cls : ''}"><i>${k}${cls ? '*' : ''}</i>`
    + `<b>${v}<s>/${t}${u}</s></b>`
    + `<em><u data-pct="${t ? Math.min(100, Math.round(v / t * 100)) : 0}"></u></em></div>`
    ).join('') + `</div>`;
}

function mealRow(m){
  const f   = ateOf(selDay, m.t);
  const st  = f === 1 ? ' ate' : f === 0.5 ? ' half' : '';
  const pct = m.kc ? Math.round(400 * (Number(m.cb) || 0) / m.kc) : 0;
  const items = combineMealItems(m.i || []).map(it =>
      `<li><i>${Number(it.c) || 0}</i><span>${esc(it.n)}</span></li>`).join('');
  const said = f === 1 ? 'eaten' : f === 0.5 ? 'half eaten' : 'not eaten';
  return `<div class="hxr"><time>${clock(mins(m.t))}</time>`
    + `<div class="hxc k${carbStep(m)}${st}">`
      + `<span class="hxrail"><i></i><i></i><i></i></span>`
      + `<div class="hxhd"><span class="hxt">${esc(m.l)}</span>`
      + `<span class="hxs">${Number(m.kc) || 0} kcal &middot; ${Number(m.cb) || 0} g carb &middot; ${pct}% carb</span></div>`
      + (items ? `<ul class="hxi">${items}</ul>` : '')
      /* The day travels on the button, not in a global: a tap must log against
         its own card's date even if the strip moves underneath it. */
      + `<button class="hxtick" data-log="${esc(m.t)}" data-log-day="${esc(selDay)}"`
      + ` aria-pressed="${f > 0 ? 'true' : 'false'}" aria-label="${esc(m.l)}, ${said}">`
      + `<span class="hxmk"></span></button>`
    + `</div></div>`;
}

function rideRow(tr, at){
  const bkc = (tr.bk && Number(tr.bk.cb)) || 0;
  const bkk = (tr.bk && Number(tr.bk.kc)) || 0;
  const gph = tr.h ? Math.round(bkc / tr.h) : 0;
  const act = selDay === todayKey() && coach.rides && coach.rides.length
    ? coach.rides.reduce((a, x) => a + (Number(x.kcal) || 0), 0) : null;
  return `<div class="hxr"><time>${at >= 0 ? clock(at + 1) : '&mdash;'}</time>`
    + `<div class="hxride"><span class="hxt">${esc(hhm(tr.h))} &middot; ${esc(tr.kind)}</span>`
    + `<span class="hxs">${bkc} g carb on the bike` + (bkk ? ` &middot; ${bkk} kcal` : '')
    + ` &middot; about ${gph} g an hour</span>`
    + `<span class="hxs">` + (act !== null ? `<b>${act} kcal ridden</b>` : `${Math.round(tr.h * 600)} kcal planned`)
    + `</span></div></div>`;
}

const restRow = () => `<div class="hxr"><time>&mdash;</time>`
  + `<div class="hxrest"><span class="hxt">No riding</span>`
  + `<span class="hxs">eat to the day&rsquo;s totals, no bottle needed</span></div></div>`;

/* ---- One day, whole ----------------------------------------------------
   The timeline could be tapped but showed no food; the day-by-day blocks
   showed the food but could not be tapped and reprinted all seven days every
   time. This is both, once. */
function fuelDay(){
  if (!selDay) selDay = todayKey();
  const day = dayOf(selDay);
  if (!day) return weekStrip() + `<div class="empty">No plan for that day.</div>`;
  const tr = (plan.training || []).find(x => x.d === dnum(selDay)) || null;

  const sum = day.meals.reduce((a, m) =>
    ({ kc: a.kc + (Number(m.kc) || 0), cb: a.cb + (Number(m.cb) || 0) }), { kc: 0, cb: 0 });
  const eaten = day.meals.reduce((a, m) => {
    const f = ateOf(selDay, m.t);
    return { kc: a.kc + (Number(m.kc) || 0) * f, cb: a.cb + (Number(m.cb) || 0) * f };
  }, { kc: 0, cb: 0 });

  const rows = day.meals.map(m => ({ at: mins(m.t), meal: m }));
  if (tr && tr.h){
    /* The ride sits where its on-bike food starts. One riding day has no
       on-bike meal — it gets no clock rather than a fabricated one. */
    const onb = day.meals.find(m => /on the bike/i.test(m.l || ''));
    rows.push({ at: onb ? mins(onb.t) - 1 : -1, ride: tr });
  } else {
    rows.push({ at: -1, rest: true });
  }
  rows.sort((x, y) => x.at - y.at);

  return weekStrip() + dayHead(day, tr, sum) + macroRow(day, sum, eaten)
    + `<div class="hxtl">`
    + rows.map(r => r.rest ? restRow() : r.ride ? rideRow(r.ride, r.at) : mealRow(r.meal)).join('')
    + `</div>`
    + `<p class="hxnote">Tap the circle once for eaten, twice for about half. Calories and carbs are exact; protein and fat are marked * because the plan only carries them as day totals and they are shared out here by calories.</p>`;
}

function coachCard(){
  const day = dayOf(selDay || todayKey());
  if (!day) return '';
  const tr = (plan.training || []).find(x => x.d === dnum(selDay || todayKey()));
  const isToday = (selDay || todayKey()) === todayKey();
  const rides = (isToday && coach.rides) || [];
  const secs = rides.reduce((a,r) => a + (r.secs||0), 0);
  const burn = rides.reduce((a,r) => a + (r.kcal||0), 0);
  const planK = Math.round(((tr && tr.h) || 0) * 600);
  const gap = rides.length ? Math.round(burn - planK) : 0;
  const meas = rides.length > 0 && rides.every(r => r.trust === 'measured');

  let out = `<div class="card coach">`;
  if (rides.length){
    out += `<div class="cmp"><span>planned</span><b>${esc(hhm(((tr&&tr.h)||0)))}</b><b>${planK} kcal</b></div>`
        + `<div class="cmp"><span>ridden</span><b>${esc(hhm(secs/3600))}</b><b>${burn} kcal</b></div>`
        + `<div class="cmp gap ${gap < 0 ? 'under' : 'over'}"><span></span><b>${meas ? '<span class="meas">power meter</span>' : ''}</b><b>${gap > 0 ? '+' : ''}${gap} kcal</b></div>`;
  } else if (isToday){
    out += `<div class="cmp dim"><span>ridden</span><b>${coach.rides === null ? '&hellip;' : 'nothing yet'}</b><b></b></div>`;
  }
  out += `<button id="coach_go" class="cbtn"${coach.busy ? ' disabled' : ''}>${coach.busy ? 'Thinking&hellip;' : 'What should change?'}</button>`;
  if (coach.err) out += `<p class="cerr">${esc(coach.err)}</p>`;
  if (coach.advice){
    const a = coach.advice;
    out += `<div class="adv"><p class="ahead">${esc(a.headline)}</p><p class="adet">${esc(a.detail)}</p>`
      + (a.changes||[]).map(c => `<div class="achg"><b>${esc(c.meal)}</b><span>${esc(c.change)}</span>`
        + `<i class="${c.kcal_delta < 0 ? 'dn' : 'up'}">${c.kcal_delta > 0 ? '+' : ''}${Number(c.kcal_delta)||0}</i></div>`).join('')
      + (!(a.changes||[]).length ? `<p class="anone">Nothing to change &mdash; today is close enough.</p>` : '')
      + `<p class="afoot">A suggestion, not a change &mdash; the plan is untouched.</p></div>`;
  }
  return out + `</div>`;
}

/* Bar widths are set through the CSSOM rather than a style attribute: the CSP
   is hash-only, so style="width:60%" in an innerHTML string is dropped on the
   floor. Assigning .style from script is unaffected. */
function paintBars(){
  document.querySelectorAll('.hxm u[data-pct]').forEach(u => {
    u.style.width = (Number(u.dataset.pct) || 0) + '%';
  });
}

function render(){
  const w = curWeek();
  if (!w){ $('#main').innerHTML = '<div class="empty">No plan loaded.</div>'; return; }
  
  const mode = modeOf(tab);

  /* Title says where you are; the eyebrow carries the week and its dates,
     which the old header never showed. No duplicating the chips below. */
  $('#wlab').textContent = TAB_NAME[tab] || 'Shopping';
  $('#hmeta').textContent = [
    w.label,
    w.dates || '',
    w.cooks ? w.cooks + ' cook nights' : ''
  ].filter(Boolean).join(' \u00b7 ');

  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === tab);
    /* The day-by-day fuelling view only exists when the block ships a
       days[] array. Without it the tab would open on an empty screen. */
    b.hidden = modeOf(b.dataset.t) !== mode ||
               (b.dataset.t === 'P' && !(plan.days && plan.days.length));
  });
  document.querySelectorAll('#modebar button').forEach(b =>
    b.classList.toggle('on', b.dataset.m === mode));

  $('#tabs').style.display = (mode === 'shop') ? 'none' : 'flex';
  $('#badd').style.display = (mode === 'shop') ? 'flex' : 'none';
  $('#bfilter').style.display = (mode === 'shop') ? 'flex' : 'none';
  
  // Filter button state
  const btnF = $('#bfilter');
  btnF.classList.toggle('active', hideChecked);
  $('#flab').textContent = hideChecked ? 'To Get Only' : 'All Items';

  const m = $('#main');

  if (tab === 'P'){
    m.innerHTML = dayBlocks(w);
    totals(); paintBars(); updateHeaderHeight(); return;
  }

  if (tab === 'D'){
    const nights = (w.dinners || []);
    m.innerHTML = nights.length
      ? nights.map(dn => {
          if (!dn.cook){
            /* A reheat night is not a recipe. Point back at the night it came from. */
            const from = nights.filter(x => x.cook && x.dish === dn.dish)[0];
            return `<div class="rheat">
              <span class="rday">${esc(dn.d)}</span>
              <span class="rtext">Reheat &middot; ${esc(dn.dish)}${from ? ' <i>from ' + esc(from.d) + '</i>' : ''}</span>
            </div>`;
          }
          const r = RECIPES[dn.dish];
          const ings = dishIngredients(w, dn.dish);
          const heats = reheatDays(w, dn.dish);
          return `<article class="rcard">
            <header class="rhd">
              <span class="rday">${esc(dn.d)}</span>
              <span class="rcost">${dn.c ? '$' + (Number(dn.c) || 0).toFixed(2) : ''}</span>
            </header>
            <h3 class="rdish">${esc(dn.dish)}</h3>
            <p class="rtag">${esc(dn.tag || 'cook tonight')}${heats.length ? ' &middot; reheats ' + esc(heats.join(', ')) : ''}</p>
            ${ings.length ? `<div class="rsec">What you need</div>
              <ul class="ring">${ings.map(it =>
                `<li><i>${esc(it.q || '')}</i>${esc(it.n)}${it.store === 'M' ? '<b>Meijer</b>' : ''}</li>`).join('')}</ul>` : ''}
            ${r && r.pantry && r.pantry.length ? `<div class="rsec">From the cupboard</div>
              <ul class="ring pantryring">${r.pantry.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
            ${r ? `<div class="rsec">Method</div>
              <ol class="rsteps">${r.method.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
              <p class="rtip">${esc(r.serves)}</p>` :
              `<p class="rtip">No method written for this one yet.</p>`}
          </article>`;
        }).join('')
      : '<div class="empty">No dinners planned for this week.</div>';
    totals(); updateHeaderHeight(); return;
  }
  
  if (tab === 'F'){
    /* Training first: what you are riding this week and what to eat on the bike
       for it. The recipes underneath are how you make that fuel. */
    const wk = (plan.training || []).filter(t => t.wk === w.id);
    const hrs = wk.reduce((a, t) => a + (Number(t.h) || 0), 0);
    const rides = wk.filter(t => (Number(t.h) || 0) > 0).length;
    const onbike = wk.reduce((a, t) => a + ((t.bk && Number(t.bk.cb)) || 0), 0);

    if (coach.rides === null && coach.day !== todayKey()) loadRides();
    if (block.state === 'idle') loadBlockRides();
    if (dayRide.day !== (selDay || todayKey())) loadDayRides(selDay || todayKey());
    m.innerHTML = fuelDay() + rideDetail() + coachCard() + analysisCard()
      + `<div class="sech">August &middot; the block at a glance</div>` + monthGrid()
      + (wk.length ? `
      <div class="trainhd">
        <div><span class="tnum">${(Math.round(hrs * 100) / 100)}</span><span class="tlab">hours</span></div>
        <div><span class="tnum">${rides}</span><span class="tlab">ride days</span></div>
        <div><span class="tnum">${onbike}</span><span class="tlab">g carb on bike</span></div>
      </div>
      ` : '')
      + `<div class="sech">How to make the fuel</div>`
      + (plan.fuel || []).map(([hh, pp]) =>
        `<div class="card"><h3>${esc(hh)}</h3><p>${esc(pp)}</p></div>`).join('')
      + `<div class="hint">Ingredients can appear under two cook nights &mdash; that is deliberate and the totals add up.</div>`;
    /* Both of these size elements through the CSSOM. paintBars() was only ever
       called from the retired 'P' branch, so the four macro bars in .hxmac have
       been rendering at zero width on every reachable path. */
    totals(); paintBars(); paintMonth(); updateHeaderHeight(); return;
  }

  const secs = shopList(w);
  let html = (w.note && tab === 'A') ? `<p class="wnote">${esc(w.note)}</p>` : '';

  let sectionCount = 0;

  secs.forEach(s => {
    const cook = false;   // recipes are folded into aisles now; no cook sections in the list

    // Sort items so unchecked remain at top, checked move to bottom
    const itemsWithKeys = s.items.map(it => {
      const k = rowKey(w.id, it);
      const on = ticks[k] && ticks[k].v;
      return { it, k, on };
    });

    const visibleItems = hideChecked ? itemsWithKeys.filter(x => !x.on) : itemsWithKeys;

    if (visibleItems.length > 0) {
      sectionCount++;
      html += `<div class="sech${cook?' cook':''}">${esc(s.sec)}</div>`;
      
      // Render unchecked first, then checked
      const sorted = hideChecked ? visibleItems : [...visibleItems].sort((a,b) => (a.on === b.on ? 0 : a.on ? 1 : -1));
      
      html += sorted.map(({it, k, on}) => {
        return `<div class="row${on?' done':''}" data-k="${esc(k)}" data-c="${Number(it.c) || 0}"${it.pantry ? ` data-pantry-name="${esc(it.n)}"` : ''}>
          <div class="box">\u2713</div>
          <div class="mid">
            ${it.q ? `<span class="q">${esc(it.q)}</span>`:''}
            <span class="n">${esc(it.n)}${it.store === 'M' ? ' <b class="tagM">Meijer</b>' : ''}</span>
            ${it.note ? `<span class="note">${esc(it.note)}</span>`:''}
          </div>
          <div class="c">${it.c > 0 ? it.c.toFixed(2) : ''}</div>
          ${it.extraId ? `<button class="del" data-del="${esc(it.extraId)}" aria-label="Remove ${esc(it.n)}">\u00d7</button>` : ''}
          ${it.pantry ? `<span class="tagP">${it.pantry === 'out' ? 'Out' : 'Low'}</span>` : ''}
        </div>`;
      }).join('');
    }
  });

  if (sectionCount === 0) {
    html += `<div class="empty">${hideChecked ? 'All items checked off!' : 'Nothing from ' + (tab==='M'?'Meijer':'Aldi') + ' this week.'}<br><br>Tap <b>+</b> to add an item.</div>`;
  }

  m.innerHTML = html;
  totals();
  updateHeaderHeight();
}

function totals(){
  let got = 0, left = 0, nLeft = 0;
  const w = curWeek();
  if (!w) return;

  // Calculate totals from entire list (including hidden items)
  shopList(w).forEach(s => {
    s.items.forEach(it => {
      const k = rowKey(w.id, it);
      const c = Number(it.c) || 0;
      if (ticks[k] && ticks[k].v) got += c; else { left += c; nLeft++; }
    });
  });

  /* extras are inside shopList() now, so they are already counted above */

  if (modeOf(tab) === 'shop'){
    const all = got + left;
    $('#got').textContent  = '$' + got.toFixed(2);
    $('#left').textContent = 'of $' + all.toFixed(2);
    $('#rem').textContent  = nLeft ? '\u00b7 ' + nLeft + ' to get' : (all ? '\u00b7 all done' : '');
    $('#prog').style.width = (all > 0 ? (got / all * 100) : 0) + '%';
  } else {
    /* Planning view: the week's whole basket, both stores, nothing checked off. */
    let planned = 0;
    ['A','M'].forEach(st => ((w.lists && w.lists[st]) || []).forEach(s =>
      s.items.forEach(it => { planned += Number(it.c) || 0; })));
    $('#got').textContent  = '$' + planned.toFixed(2);
    $('#left').textContent = 'planned for the week';
    $('#rem').textContent  = (w.days && w.days.length) ? '\u00b7 ' + w.days.length + ' days' : '';
    $('#prog').style.width = '100%';
  }
}

/* Haptic Feedback Helper for Store Usability */
function triggerHaptic(){
  if ('vibrate' in navigator) {
    try { navigator.vibrate(15); } catch(e){}
  }
}

/* Touch & Click Event Delegation */
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip){
    wi = Number(chip.dataset.w);
    LS.set('v2.week', wi);
    chips();
    render();
    window.scrollTo(0,0);
    return;
  }

  const mb = e.target.closest('#modebar button');
  if (mb){
    const m = mb.dataset.m;
    if (modeOf(tab) !== m){
      tab = lastTab[m] || (m === 'shop' ? 'A' : 'P');
      LS.set('v2.tab', tab);
      render();
      window.scrollTo(0,0);
      triggerHaptic();
    }
    return;
  }

  const tb = e.target.closest('#tabs button');
  if (tb){
    tab = tb.dataset.t;
    LS.set('v2.tab', tab);
    lastTab[modeOf(tab)] = tab;
    jset('v2.lastTab', lastTab);
    render();
    window.scrollTo(0,0);
    return;
  }

  if (e.target.closest('#bfilter')){
    hideChecked = !hideChecked;
    persist();
    render();
    triggerHaptic();
    return;
  }

  if (e.target.closest('#bsync')){
    if (!cfg.key || needCode) { openSettings(); return; }
    sync(false); triggerHaptic(); return;
  }
  
  if (e.target.closest('#bset')){
    $('#s_url').value = cfg.url;
    $('#s_key').value = cfg.key;
    $('#s_stat').textContent = lastSync ? 'Last synced ' + new Date(lastSync).toLocaleString() : 'Never synced';
    $('#setsheet').classList.add('open');
    return;
  }

  if (e.target.closest('#badd')){
    $('#ai_list').innerHTML = itemCorpus().map(x => `<option value="${esc(x)}"></option>`).join('');
    $('#ai_n').value = ''; $('#ai_q').value = ''; $('#ai_c').value = '';
    $('#addsheet').classList.add('open');
    setTimeout(()=> $('#ai_n').focus(), 150);
    return;
  }

  if (e.target.closest('[data-close]') || e.target.classList.contains('sheet')){
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    return;
  }

  if (e.target.closest('#s_go')){
    cfg = {url: $('#s_url').value.trim(), key: $('#s_key').value.trim()};
    needCode = false; pollFails = 0; startPolling();
    jset('v2.cfg', cfg);
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    sync(false);
    return;
  }

  if (e.target.closest('#ai_go')){
    const n = $('#ai_n').value.trim().slice(0,200);
    if (!n) return;
    const id = uid();
    extras[id] = {
      name: n,
      qty: $('#ai_q').value.trim().slice(0,200),
      cost: parseFloat($('#ai_c').value) || 0,
      store: 'A',
      week: curWeek().id,
      t: now()
    };
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
    persist();
    queue();
    render();
    triggerHaptic();
    return;
  }

  const del = e.target.closest('[data-del]');
  if (del){
    e.stopPropagation();
    const id = del.dataset.del;
    extras[id] = {...extras[id], deleted: true, t: now()};
    persist();
    queue();
    render();
    triggerHaptic();
    return;
  }

  const dsel = e.target.closest('.hxd');
  if (dsel && !dsel.classList.contains('off')){
    selDay = dsel.dataset.day;
    /* A different day has different advice; showing yesterday's would be a lie. */
    coach.advice = null; coach.err = '';
    render(); return;
  }

  /* A cell in the block grid selects that day above, so the grid is a way into
     the plan rather than a picture beside it. Its own class, not .row: the
     shopping tick handler claims .row globally. */
  const cgs = e.target.closest('.cgc[data-cgday]');
  if (cgs && cgs.dataset.cgday){
    selDay = cgs.dataset.cgday;
    coach.advice = null; coach.err = '';
    render();
    const m = $('#main'); if (m) m.scrollIntoView({ block: 'start' });
    return;
  }

  /* none -> ate -> half -> none. Two taps for "about half", which is as fine
     as anyone is honestly going to be about a plate of food. */
  const lg = e.target.closest('[data-log]');
  if (lg){
    /* The card's own day, never the strip's — they can differ mid-render. */
    const d = lg.dataset.logDay || selDay;
    const cur = ateOf(d, lg.dataset.log);
    setAte(d, lg.dataset.log, cur === 0 ? 1 : cur === 1 ? 0.5 : 0);
    return;
  }

  if (e.target.closest('#coach_go')){ runCoach(); return; }
  if (e.target.closest('#look_go')){ runAnalyze(); return; }
  if (e.target.closest('#ride_go')){ readRide(); return; }

  if (e.target.closest('#reset')){
    const w = curWeek();
    if (confirm('Clear all checked items for ' + w.label + '?')) {
      Object.keys(ticks).forEach(k => {
        if (k.startsWith(w.id + '|')) ticks[k] = {v: false, t: now()};
      });
      persist();
      queue();
      document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open'));
      render();
      triggerHaptic();
    }
    return;
  }

  const pan = e.target.closest('[data-pan]');
  if (pan){
    const nm = pan.dataset.pan;
    pantryState[nm] = { s: PANTRY_NEXT[pantryOf(nm)] || 'low', t: now() };
    persist(); queue(); triggerHaptic(); render();
    return;
  }

  const row = e.target.closest('.row');
  if (row && row.dataset.pantryName){
    /* Ticking a flagged staple on the shop list means you bought it. */
    pantryState[row.dataset.pantryName] = { s: 'ok', t: now() };
    persist(); queue(); triggerHaptic(); render();
    return;
  }
  if (row){
    const k = row.dataset.k;
    const on = !(ticks[k] && ticks[k].v);
    ticks[k] = {v: on, t: now()};
    
    // Haptic feedback & instant animation
    triggerHaptic();
    row.classList.toggle('done', on);
    
    persist();
    queue();
    
    // If filter mode is hiding checked items, re-render smoothly
    if (hideChecked) {
      setTimeout(() => render(), 180);
    } else {
      totals();
    }
  }
});

/* Re-sync when returning to app foreground */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { sync(dirty); startPolling(); } else { stopPolling(); }
});
window.addEventListener('online', () => { pollFails = 0; sync(dirty); startPolling(); });

/* Init */
/* First run of the block: land on the week that contains today. This has to
   happen before the first render, not after, or the app draws the wrong week
   and never redraws. */
if (!weekWasStored){
  const wt = weekIndexOfToday();
  if (wt >= 0) { wi = wt; LS.set('v2.week', String(wi)); }
}

chips();
render();
setDot();
updateHeaderHeight();

if (cfg.url && !cfg.key) openSettings(); else if (cfg.url) { sync(dirty); startPolling(); }
</script>
</body>
</html>
