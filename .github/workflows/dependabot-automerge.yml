name: dependabot auto-merge

# Patch and minor updates merge themselves once the security workflow is green.
#
# Majors DO reach this path, and the "leave majors for review" step below is the
# only thing that handles them. The npm ecosystem ignores majors in
# dependabot.yml; github-actions deliberately does not, because an action major
# is how a retirement arrives. This comment used to claim majors "never reach
# this path", which was false for actions and is why five of them sat open from
# 27 July 2026 being told to read the wrangler changelog.
#
# Requires, once, in repo Settings:
#   - General > "Allow auto-merge" enabled
#   - Branch protection on main requiring the "regression scan" and "codeql" checks
# Without the required checks, auto-merge would land the PR unverified.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: enable auto-merge for patch and minor
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Named for what it is: these do not merge themselves and will sit here
      # until someone looks. A full queue blocks every other update in the same
      # ecosystem, so leaving one open indefinitely has a cost beyond itself.
      - name: leave majors for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        # `>-` and not `|`: a multi-line block scalar bakes its own indentation
        # into the comment body, and a bare scalar breaks on the "changelog:"
        # colon, which YAML reads as a nested mapping.
        run: >-
          gh pr comment "$PR_URL" --body "Major update of \`$DEP\` - not
          auto-merged, and it blocks this ecosystem's dependabot queue until
          merged or closed. Check that dependency's own changelog - an action
          major is usually a runner bump, an npm major here can change
          wrangler's config schema or deploy semantics."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP: ${{ steps.meta.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
